<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>江南水乡 · 烟雨古镇 | 3D</title>
  <style>
    :root { --accent: #ffce7a; --seal: #c9463c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden;
      font-family: 'Songti SC', 'STSong', 'PingFang SC', 'Microsoft YaHei', system-ui, serif; }
    body { background: #0b1116; color: #fff; }
    canvas { display: block; }

    .panel {
      position: absolute; z-index: 10;
      background: rgba(16, 22, 26, 0.5);
      backdrop-filter: blur(16px) saturate(130%);
      -webkit-backdrop-filter: blur(16px) saturate(130%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      pointer-events: none;
    }

    #hud-tl { top: 18px; left: 18px; padding: 14px 20px; min-width: 200px; }
    #shichen { font-size: 2rem; font-weight: 700; letter-spacing: 4px; color: var(--accent);
      text-shadow: 0 0 16px rgba(255, 206, 122, 0.35); line-height: 1; }
    #clock { margin-top: 6px; font-size: 0.82rem; color: #cfd8df; letter-spacing: 2px; }
    #weather { margin-top: 4px; font-size: 0.74rem; color: #8fa3ad; letter-spacing: 1px; }
    #seal { position: absolute; top: 14px; right: 14px; width: 26px; height: 26px; border-radius: 5px;
      background: var(--seal); opacity: .85; font-size: .7rem; line-height: 26px; text-align: center;
      color: #ffe9d6; letter-spacing: 0; }

    #hud-tr { top: 18px; right: 18px; padding: 10px 16px; font-size: 0.85rem; font-weight: 700;
      color: var(--accent); letter-spacing: 1px; }

    #hud-help { bottom: 18px; left: 50%; transform: translateX(-50%); padding: 10px 22px;
      font-size: 0.76rem; color: rgba(255,255,255,0.84); letter-spacing: 0.6px; text-align: center;
      white-space: nowrap; }
    #hud-help b { color: var(--accent); }

    #loader { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #0b1116; transition: opacity .9s; }
    #loader .ring { width: 54px; height: 54px; border: 4px solid rgba(255,206,122,0.18);
      border-top-color: var(--accent); border-radius: 50%; animation: spin 1.1s linear infinite; }
    #loader .txt { font-size: 0.92rem; color: #9fb0bb; letter-spacing: 4px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 720px) {
      #hud-help { font-size: 0.64rem; padding: 8px 14px; white-space: normal; width: 88%; }
      #shichen { font-size: 1.5rem; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="loader"><div class="ring"></div><div class="txt">正在营造水乡 …</div></div>

  <div id="hud-tl" class="panel">
    <div id="seal">印</div>
    <div id="shichen">辰时</div>
    <div id="clock">08:00</div>
    <div id="weather">烟雨江南 · 巷陌 16</div>
  </div>
  <div id="hud-tr" class="panel">🚁 鸟瞰</div>
  <div id="hud-help" class="panel">
    🖱️ 拖拽旋转 · 滚轮缩放 · 右键平移 &nbsp;|&nbsp; ⌨️ <b>WASD</b> 行走 &nbsp;|&nbsp;
    <b>P</b> 鸟瞰/漫步/泛舟 &nbsp;|&nbsp; <b>T</b> 加速时辰 &nbsp;|&nbsp; <b>R</b> 烟雨
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';
    import * as BGU from 'three/addons/utils/BufferGeometryUtils.js';

    const mergeGeometries = BGU.mergeGeometries || BGU.mergeBufferGeometries;

    // ============================================================
    //  工具
    // ============================================================
    const rand = (a, b) => a + Math.random() * (b - a);
    const randInt = (a, b) => Math.floor(rand(a, b + 1));
    const choice = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;

    // ============================================================
    //  渲染器 / 场景 / 相机
    // ============================================================
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.82;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xc3d2d8, 0.0015);

    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 4000);
    camera.position.set(190, 150, 235);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minDistance = 20;
    controls.maxDistance = 780;
    controls.target.set(0, 8, 0);

    // ============================================================
    //  天空 / 光照
    // ============================================================
    const sky = new Sky();
    sky.scale.setScalar(8000);
    scene.add(sky);
    const skyU = sky.material.uniforms;
    skyU['turbidity'].value = 8;
    skyU['rayleigh'].value = 1.6;
    skyU['mieCoefficient'].value = 0.006;
    skyU['mieDirectionalG'].value = 0.82;

    const sunDir = new THREE.Vector3();
    const sunLight = new THREE.DirectionalLight(0xfff4e2, 3.6);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 1200;
    const SH = 260;
    sunLight.shadow.camera.left = -SH; sunLight.shadow.camera.right = SH;
    sunLight.shadow.camera.top = SH; sunLight.shadow.camera.bottom = -SH;
    sunLight.shadow.bias = -0.0004;
    scene.add(sunLight);
    scene.add(sunLight.target);

    const hemi = new THREE.HemisphereLight(0xbcd6ff, 0x5a5344, 0.6);
    scene.add(hemi);
    const ambient = new THREE.AmbientLight(0xa8b8c4, 0.35);
    scene.add(ambient);
    const moonLight = new THREE.DirectionalLight(0x9fb6ff, 0);
    moonLight.position.set(-220, 260, -160);
    scene.add(moonLight);

    // 环境反射（天空 PMREM，让水面与玻璃有倒影）
    let pmrem = null, envRT = null, envScene = null;
    try {
      pmrem = new THREE.PMREMGenerator(renderer);
      envScene = new THREE.Scene();
      const skyForEnv = sky.clone();          // 共享材质，太阳角度自动同步
      skyForEnv.scale.setScalar(120);
      envScene.add(skyForEnv);
    } catch (e) { pmrem = null; }

    function refreshEnv() {
      if (!pmrem) return;
      try {
        const rt = pmrem.fromScene(envScene, 0.02, 1, 400);
        if (envRT) envRT.dispose();
        envRT = rt;
        scene.environment = rt.texture;
      } catch (e) { /* 忽略：无环境贴图也能正常运行 */ }
    }

    // ============================================================
    //  程序化纹理
    // ============================================================
    function cnv(w, h) {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
    function toTex(canvas) {
      const t = new THREE.CanvasTexture(canvas);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.colorSpace = THREE.SRGBColorSpace;
      t.anisotropy = 4;
      return t;
    }

    // 白墙：粉墙黛瓦的「粉墙」——米白基底 + 水渍 + 墙脚青苔
    function makeWallTex() {
      const c = cnv(512, 512), g = c.getContext('2d');
      g.fillStyle = '#e9e2d2'; g.fillRect(0, 0, 512, 512);
      for (let i = 0; i < 60; i++) { // 水渍
        const x = rand(0, 512), y = rand(0, 400), r = rand(30, 130);
        const rg = g.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, `rgba(140,132,112,${rand(0.05, 0.13)})`);
        rg.addColorStop(1, 'rgba(140,132,112,0)');
        g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      }
      const moss = g.createLinearGradient(0, 400, 0, 512); // 墙脚苔痕
      moss.addColorStop(0, 'rgba(90,104,78,0)');
      moss.addColorStop(1, 'rgba(78,96,64,0.42)');
      g.fillStyle = moss; g.fillRect(0, 380, 512, 132);
      for (let i = 0; i < 2600; i++) { // 颗粒
        g.fillStyle = `rgba(0,0,0,${rand(0.02, 0.07)})`;
        g.fillRect(rand(0, 512), rand(0, 512), 2, 2);
      }
      for (let i = 0; i < 14; i++) { // 裂纹
        g.strokeStyle = `rgba(110,102,88,${rand(0.1, 0.25)})`;
        g.lineWidth = rand(0.6, 1.6);
        g.beginPath();
        let x = rand(0, 512), y = rand(0, 512);
        g.moveTo(x, y);
        for (let k = 0; k < 6; k++) { x += rand(-26, 26); y += rand(6, 34); g.lineTo(x, y); }
        g.stroke();
      }
      return toTex(c);
    }

    // 黛瓦：沿 v 方向（坡面）的瓦垄
    function makeTileTex() {
      const c = cnv(256, 256), g = c.getContext('2d');
      g.fillStyle = '#3b424a'; g.fillRect(0, 0, 256, 256);
      const step = 18;
      for (let x = 0; x < 256; x += step) {
        const lg = g.createLinearGradient(x, 0, x + step, 0);
        lg.addColorStop(0, '#2c3238');
        lg.addColorStop(0.35, '#59636d');
        lg.addColorStop(0.62, '#474f58');
        lg.addColorStop(1, '#282d33');
        g.fillStyle = lg; g.fillRect(x, 0, step - 2, 256);
      }
      for (let i = 0; i < 2200; i++) {
        g.fillStyle = `rgba(0,0,0,${rand(0.03, 0.12)})`;
        g.fillRect(rand(0, 256), rand(0, 256), 2, 3);
      }
      return toTex(c);
    }

    // 石板路 / 砌石
    function makeStoneTex(base = '#8a8f92') {
      const c = cnv(512, 512), g = c.getContext('2d');
      g.fillStyle = '#5f666a'; g.fillRect(0, 0, 512, 512);
      const cell = 64;
      for (let y = 0; y < 512; y += cell) {
        const off = (y / cell) % 2 ? cell / 2 : 0;
        for (let x = -cell; x < 512; x += cell) {
          const px = x + off + rand(1, 4), py = y + rand(1, 4);
          const w = cell - rand(4, 8), h = cell - rand(4, 8);
          const v = rand(-16, 16);
          const r0 = clamp(parseInt(base.slice(1, 3), 16) + v, 0, 255) | 0;
          const g0 = clamp(parseInt(base.slice(3, 5), 16) + v, 0, 255) | 0;
          const b0 = clamp(parseInt(base.slice(5, 7), 16) + v, 0, 255) | 0;
          g.fillStyle = 'rgb(' + r0 + ',' + g0 + ',' + b0 + ')';
          g.beginPath();
          g.roundRect ? g.roundRect(px, py, w, h, 4) : g.rect(px, py, w, h);
          g.fill();
        }
      }
      for (let i = 0; i < 2400; i++) {
        g.fillStyle = `rgba(0,0,0,${rand(0.03, 0.1)})`;
        g.fillRect(rand(0, 512), rand(0, 512), 3, 2);
      }
      return toTex(c);
    }

    // 木构（柱、梁、栏、船身）
    function makeWoodTex() {
      const c = cnv(256, 256), g = c.getContext('2d');
      g.fillStyle = '#6a4a30'; g.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 90; i++) {
        g.strokeStyle = `rgba(${rand(30, 70)},${rand(20, 45)},${rand(10, 30)},${rand(0.15, 0.45)})`;
        g.lineWidth = rand(0.8, 3);
        g.beginPath();
        const x = rand(0, 256);
        g.moveTo(x, 0);
        for (let y = 0; y < 256; y += 24) g.lineTo(x + rand(-5, 5), y);
        g.stroke();
      }
      return toTex(c);
    }

    // 门脸（木门 + 格栅窗），同时输出窗光 emissive
    function makeShopTex(kind) {
      const W = 512, H = 512;
      const c = cnv(W, H), g = c.getContext('2d');
      const e = cnv(W, H), ge = e.getContext('2d');
      g.fillStyle = '#e6dece'; g.fillRect(0, 0, W, H);
      ge.fillStyle = '#000'; ge.fillRect(0, 0, W, H);

      // 斑驳墙
      for (let i = 0; i < 26; i++) {
        const x = rand(0, W), y = rand(0, H), r = rand(20, 90);
        const rg = g.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, `rgba(130,122,104,${rand(0.05, 0.12)})`);
        rg.addColorStop(1, 'rgba(130,122,104,0)');
        g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
      }

      const woodDark = '#4a3323', woodMid = '#6d4c31', paper = '#cbb98a';

      function drawWindow(x, y, w, h) {
        // 窗洞
        g.fillStyle = woodDark; g.fillRect(x - 6, y - 6, w + 12, h + 12);
        g.fillStyle = paper; g.fillRect(x, y, w, h);
        // 格栅
        g.strokeStyle = woodMid; g.lineWidth = 4;
        const cols = Math.max(2, Math.round(w / 34)), rows = Math.max(2, Math.round(h / 34));
        for (let i = 1; i < cols; i++) { const px = x + (w / cols) * i; g.beginPath(); g.moveTo(px, y); g.lineTo(px, y + h); g.stroke(); }
        for (let i = 1; i < rows; i++) { const py = y + (h / rows) * i; g.beginPath(); g.moveTo(x, py); g.lineTo(x + w, py); g.stroke(); }
        // 窗内暖光
        ge.fillStyle = '#ffcb7d'; ge.fillRect(x, y, w, h);
        ge.fillStyle = '#000';
        for (let i = 1; i < cols; i++) { const px = x + (w / cols) * i; ge.fillRect(px - 2, y, 4, h); }
        for (let i = 1; i < rows; i++) { const py = y + (h / rows) * i; ge.fillRect(x, py - 2, w, 4); }
      }

      function drawDoor(x, y, w, h) {
        g.fillStyle = woodDark; g.fillRect(x - 8, y - 8, w + 16, h + 8);
        g.fillStyle = '#5b3d28'; g.fillRect(x, y, w, h);
        g.strokeStyle = '#3b2718'; g.lineWidth = 3;
        for (let i = 1; i < 5; i++) { const px = x + (w / 5) * i; g.beginPath(); g.moveTo(px, y + 8); g.lineTo(px, y + h); g.stroke(); }
        g.strokeStyle = '#2e1e12'; g.lineWidth = 4;
        g.beginPath(); g.moveTo(x + w / 2, y); g.lineTo(x + w / 2, y + h); g.stroke();
        // 门环
        g.fillStyle = '#c9a24a';
        g.beginPath(); g.arc(x + w / 2 - 14, y + h * 0.5, 6, 0, 7); g.fill();
        g.beginPath(); g.arc(x + w / 2 + 14, y + h * 0.5, 6, 0, 7); g.fill();
        // 门缝透光
        ge.fillStyle = '#ffb860'; ge.fillRect(x + w / 2 - 2, y + 6, 4, h - 6);
      }

      // 屋檐横楣
      g.fillStyle = woodDark; g.fillRect(0, 0, W, 34);
      g.fillStyle = '#3a2718'; g.fillRect(0, 34, W, 8);

      if (kind === 0) {          // 店铺：大开间
        drawDoor(W * 0.3, H * 0.34, W * 0.4, H * 0.56);
        drawWindow(W * 0.06, H * 0.28, W * 0.2, H * 0.3);
        drawWindow(W * 0.74, H * 0.28, W * 0.2, H * 0.3);
      } else if (kind === 1) {   // 民居：小门 + 双窗
        drawDoor(W * 0.42, H * 0.42, W * 0.16, H * 0.48);
        drawWindow(W * 0.12, H * 0.3, W * 0.22, H * 0.26);
        drawWindow(W * 0.66, H * 0.3, W * 0.22, H * 0.26);
      } else {                   // 二层楼：上下两排窗
        drawDoor(W * 0.4, H * 0.6, W * 0.2, H * 0.32);
        drawWindow(W * 0.08, H * 0.14, W * 0.24, H * 0.24);
        drawWindow(W * 0.68, H * 0.14, W * 0.24, H * 0.24);
        drawWindow(W * 0.08, H * 0.48, W * 0.24, H * 0.22);
        drawWindow(W * 0.68, H * 0.48, W * 0.24, H * 0.22);
        // 二层木栏
        g.fillStyle = woodMid; g.fillRect(0, H * 0.42, W, 10);
        for (let i = 0; i < 26; i++) g.fillRect(i * (W / 26) + 6, H * 0.42, 4, H * 0.04 + 14);
      }
      return { map: toTex(c), emissiveMap: toTex(e) };
    }

    const wallTex = makeWallTex();
    const tileTex = makeTileTex();
    const stoneTex = makeStoneTex('#8d9296');
    const bankTex = makeStoneTex('#6f7276');
    const woodTex = makeWoodTex();
    const shopTex = [0, 1, 2].map(makeShopTex);

    const matWall = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.92, metalness: 0 });
    const matTile = new THREE.MeshStandardMaterial({ map: tileTex, roughness: 0.72, metalness: 0.08 });
    const matStone = new THREE.MeshStandardMaterial({ map: stoneTex, roughness: 0.95, metalness: 0 });
    const matBank = new THREE.MeshStandardMaterial({ map: bankTex, roughness: 0.96, metalness: 0 });
    const matWood = new THREE.MeshStandardMaterial({ map: woodTex, roughness: 0.85, metalness: 0.02 });
    const matWoodDark = new THREE.MeshStandardMaterial({ color: 0x3b2a1d, roughness: 0.8 });
    const matWhite = new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.9 });

    const shopMats = shopTex.map(t => new THREE.MeshStandardMaterial({
      map: t.map, emissiveMap: t.emissiveMap, emissive: 0xffc070, emissiveIntensity: 0.02,
      roughness: 0.85, metalness: 0
    }));
    const windowMats = shopMats.slice();

    // 灯笼（夜间统一点亮）
    const matLantern = new THREE.MeshStandardMaterial({
      color: 0xc0392b, emissive: 0xff5a30, emissiveIntensity: 0.06, roughness: 0.55
    });

    // ============================================================
    //  UV / 几何小工具
    // ============================================================
    const UV = 0.28; // 每米纹理循环数

    function scaleBoxUV(geo, w, h, d, s = UV) {
      const uv = geo.attributes.uv;
      const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]];
      for (let f = 0; f < 6; f++)
        for (let i = 0; i < 4; i++) {
          const k = f * 4 + i;
          uv.setXY(k, uv.getX(k) * dims[f][0] * s, uv.getY(k) * dims[f][1] * s);
        }
      uv.needsUpdate = true;
      return geo;
    }

    // 中式硬山/悬山屋顶：三棱柱，屋脊沿 X，跨 w、高 h、进深 d
    function roofPrism(w, h, d, s = UV * 1.6) {
      const hw = w / 2, hd = d / 2, L = Math.hypot(hd, h);
      const V = {
        a: [-hw, 0, -hd], b: [hw, 0, -hd], c: [hw, 0, hd], dd: [-hw, 0, hd],
        e: [-hw, h, 0], f: [hw, h, 0]
      };
      const pos = [], uvs = [];
      const P = (p, u, v) => { pos.push(p[0], p[1], p[2]); uvs.push(u, v); };
      const T = (p1, u1, p2, u2, p3, u3) => { P(p1, u1[0], u1[1]); P(p2, u2[0], u2[1]); P(p3, u3[0], u3[1]); };

      // 端面 x = -hw
      T(V.a, [0, 0], V.dd, [d * s, 0], V.e, [d * s * 0.5, h * s]);
      // 端面 x = +hw
      T(V.b, [0, 0], V.f, [d * s * 0.5, h * s], V.c, [d * s, 0]);
      // 坡面 -z
      T(V.a, [0, 0], V.e, [0, L * s], V.f, [w * s, L * s]);
      T(V.a, [0, 0], V.f, [w * s, L * s], V.b, [w * s, 0]);
      // 坡面 +z
      T(V.dd, [0, 0], V.c, [w * s, 0], V.f, [w * s, L * s]);
      T(V.dd, [0, 0], V.f, [w * s, L * s], V.e, [0, L * s]);
      // 底面
      T(V.a, [0, 0], V.b, [w * s, 0], V.c, [w * s, d * s]);
      T(V.a, [0, 0], V.c, [w * s, d * s], V.dd, [0, d * s]);

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.computeVertexNormals();
      return geo;
    }

    // 几何收集器：按材质分桶，最后各合并成一个 Mesh（显著减少 draw call）
    function Bucket() { this.map = new Map(); }
    Bucket.prototype.add = function (geo, mat, matrix) {
      if (!this.map.has(mat)) this.map.set(mat, []);
      const g = geo.index ? geo.toNonIndexed() : geo.clone();
      g.applyMatrix4(matrix);
      this.map.get(mat).push(g);
    };
    Bucket.prototype.build = function (parent, castShadow = true) {
      const out = [];
      this.map.forEach((list, mat) => {
        if (!list.length) return;
        const merged = mergeGeometries(list, false);
        if (!merged) return;
        list.forEach(g => g.dispose());
        const m = new THREE.Mesh(merged, mat);
        m.castShadow = castShadow;
        m.receiveShadow = true;
        parent.add(m);
        out.push(m);
      });
      this.map.clear();
      return out;
    };

    const _m4 = new THREE.Matrix4();
    const _q = new THREE.Quaternion();
    const _v3 = new THREE.Vector3();
    const _s3 = new THREE.Vector3(1, 1, 1);
    function mat4(x, y, z, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
      _q.setFromEuler(new THREE.Euler(rx, ry, rz));
      return new THREE.Matrix4().compose(_v3.set(x, y, z), _q, _s3.set(sx, sy, sz));
    }

    // ============================================================
    //  水系：河床 / 水面 / 陆地街区
    // ============================================================
    const RIVERS_X = [-120, 0, 120];   // 纵向河道（沿 Z 流）
    const RIVERS_Z = [-120, 0, 120];   // 横向河道（沿 X 流）
    const R_HALF = 12;                 // 河道半宽
    const CITY = 215;
    const LAND_TOP = 1.25, LAND_H = 5.0;
    const WATER_Y = 0;

    const world = new THREE.Group();
    scene.add(world);

    // 河床
    const bed = new THREE.Mesh(
      new THREE.PlaneGeometry(1800, 1800),
      new THREE.MeshStandardMaterial({ color: 0x3c4238, roughness: 1 })
    );
    bed.rotation.x = -Math.PI / 2;
    bed.position.y = -3.2;
    bed.receiveShadow = true;
    world.add(bed);

    // 水面（顶点波动 + 天空反射）
    const waterUniforms = { uTime: { value: 0 } };
    const waterMat = new THREE.MeshStandardMaterial({
      color: 0x4a7d84, roughness: 0.12, metalness: 0.55,
      transparent: true, opacity: 0.94
    });
    waterMat.onBeforeCompile = (shader) => {
      shader.uniforms.uTime = waterUniforms.uTime;
      shader.vertexShader = 'uniform float uTime;\n' + shader.vertexShader
        .replace('#include <begin_vertex>', `#include <begin_vertex>
          float wv = sin(position.x * 0.075 + uTime * 1.15) * 0.42
                   + sin(position.y * 0.105 - uTime * 0.85) * 0.30
                   + sin((position.x + position.y) * 0.045 + uTime * 0.55) * 0.26;
          transformed.z += wv;`)
        .replace('#include <beginnormal_vertex>', `#include <beginnormal_vertex>
          float nx = cos(position.x * 0.075 + uTime * 1.15) * 0.42 * 0.075;
          float ny = cos(position.y * 0.105 - uTime * 0.85) * 0.30 * 0.105;
          objectNormal = normalize(vec3(-nx, -ny, 1.0));`);
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <dithering_fragment>', `#include <dithering_fragment>
          gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.35, 0.58, 0.64), 0.12);`);
    };
    const water = new THREE.Mesh(new THREE.PlaneGeometry(1500, 1500, 90, 90), waterMat);
    water.rotation.x = -Math.PI / 2;
    water.position.y = WATER_Y;
    water.receiveShadow = true;
    world.add(water);

    // 沿单轴切出陆地带
    function spansOf(rivers) {
      const edges = [-CITY];
      rivers.forEach(r => { edges.push(r - R_HALF, r + R_HALF); });
      edges.push(CITY);
      const out = [];
      for (let i = 0; i < edges.length; i += 2) {
        const a = edges[i], b = edges[i + 1];
        if (b - a > 30) out.push([a, b]);
      }
      return out;
    }
    const SPX = spansOf(RIVERS_X), SPZ = spansOf(RIVERS_Z);

    // 陆地块
    const blocks = [];
    SPX.forEach((sx, i) => SPZ.forEach((sz, j) => {
      blocks.push({
        i, j, minX: sx[0], maxX: sx[1], minZ: sz[0], maxZ: sz[1],
        cx: (sx[0] + sx[1]) / 2, cz: (sz[0] + sz[1]) / 2,
        w: sx[1] - sx[0], d: sz[1] - sz[0]
      });
    }));

    const landBucket = new Bucket();

    // 陆地平台 + 护岸石栏 + 河埠头
    blocks.forEach(b => {
      const bw = b.w, bd = b.d;
      const platform = scaleBoxUV(new THREE.BoxGeometry(bw, LAND_H, bd), bw, LAND_H, bd, 0.14);
      landBucket.add(platform, matStone, mat4(b.cx, LAND_TOP - LAND_H / 2, b.cz));

      // 临水面的石护栏（矮墙）
      const PARAPET = 0.95, PT = 0.55;
      const edges = [
        { axis: 'x', at: b.minZ, has: RIVERS_Z.some(r => Math.abs(b.minZ - (r + R_HALF)) < 0.5) },
        { axis: 'x', at: b.maxZ, has: RIVERS_Z.some(r => Math.abs(b.maxZ - (r - R_HALF)) < 0.5) },
        { axis: 'z', at: b.minX, has: RIVERS_X.some(r => Math.abs(b.minX - (r + R_HALF)) < 0.5) },
        { axis: 'z', at: b.maxX, has: RIVERS_X.some(r => Math.abs(b.maxX - (r - R_HALF)) < 0.5) }
      ];
      edges.forEach(e => {
        if (!e.has) return;
        const len = e.axis === 'x' ? bw : bd;
        const g = scaleBoxUV(new THREE.BoxGeometry(len, PARAPET, PT), len, PARAPET, PT, 0.3);
        if (e.axis === 'x') landBucket.add(g, matBank, mat4(b.cx, LAND_TOP + PARAPET / 2, e.at + (e.at < 0 ? 0.3 : -0.3)));
        else landBucket.add(g, matBank, mat4(e.at + (e.at < 0 ? 0.3 : -0.3), LAND_TOP + PARAPET / 2, b.cz, 0, Math.PI / 2, 0));
      });
    });
    landBucket.build(world);

    // 河埠头（下河台阶）——单独桶，用小石材质
    (function piers() {
      const bucket = new Bucket();
      blocks.forEach(b => {
        const spots = [];
        if (RIVERS_Z.some(r => Math.abs(b.minZ - (r + R_HALF)) < 0.5)) spots.push({ x: b.cx + rand(-b.w / 4, b.w / 4), z: b.minZ - 0.6, rot: 0 });
        if (RIVERS_Z.some(r => Math.abs(b.maxZ - (r - R_HALF)) < 0.5)) spots.push({ x: b.cx + rand(-b.w / 4, b.w / 4), z: b.maxZ + 0.6, rot: Math.PI });
        if (RIVERS_X.some(r => Math.abs(b.minX - (r + R_HALF)) < 0.5)) spots.push({ x: b.minX - 0.6, z: b.cz + rand(-b.d / 4, b.d / 4), rot: Math.PI / 2 });
        if (RIVERS_X.some(r => Math.abs(b.maxX - (r - R_HALF)) < 0.5)) spots.push({ x: b.maxX + 0.6, z: b.cz + rand(-b.d / 4, b.d / 4), rot: -Math.PI / 2 });
        spots.forEach(s => {
          if (Math.random() < 0.45) return;
          const steps = randInt(4, 6);
          for (let k = 0; k < steps; k++) {
            const g = scaleBoxUV(new THREE.BoxGeometry(5.5, 0.42, 1.5), 5.5, 0.42, 1.5, 0.4);
            const y = LAND_TOP - 0.25 - k * 0.4;
            const off = 0.5 + k * 1.5;
            const ox = Math.sin(s.rot) * off, oz = Math.cos(s.rot) * off;
            bucket.add(g, matBank, mat4(s.x + ox, y, s.z + oz, 0, s.rot, 0));
          }
        });
      });
      bucket.build(world);
    })();

    // ============================================================
    //  石拱桥
    // ============================================================
    const bridges = [];   // 供行走判定
    function makeBridge(cx, cz, alongX) {
      // 圆弧拱：跨 S、圆心在下方，桥面沿圆弧铺踏步，拱圈与桥面同心
      const S = 28, A = Math.PI / 5, R = S / (2 * Math.sin(A));
      const deckY = LAND_TOP;
      const cy = deckY - R * Math.cos(A);       // 拱圆心高度（在水面以下）
      const N = 22, WIDTH = 6.2;
      const bucket = new Bucket();

      for (let k = 0; k < N; k++) {
        const th = -A + (2 * A) * (k / (N - 1));
        const localX = Math.sin(th) * R;
        const y = deckY + (R * Math.cos(th) - R * Math.cos(A));
        const px = alongX ? cx + localX : cx;
        const pz = alongX ? cz : cz + localX;
        const tilt = alongX ? -th : th;
        // 踏步：先在自身平面内倾斜，再转向（几何上烘焙，避免欧拉序歧义）
        const g = scaleBoxUV(new THREE.BoxGeometry(2.0, 0.5, WIDTH), 2.0, 0.5, WIDTH, 0.35);
        g.rotateZ(tilt);
        if (!alongX) g.rotateY(Math.PI / 2);
        bucket.add(g, matStone, mat4(px, y - 0.25, pz));
        // 栏杆柱 + 扶手
        if (k % 2 === 0) {
          [-1, 1].forEach(s => {
            const ox = alongX ? 0 : s * (WIDTH / 2 - 0.35);
            const oz = alongX ? s * (WIDTH / 2 - 0.35) : 0;
            bucket.add(new THREE.BoxGeometry(0.42, 1.15, 0.42), matBank,
              mat4(px + ox, y + 0.5, pz + oz));
            const rail = new THREE.BoxGeometry(0.5, 0.24, 0.24);
            if (!alongX) rail.rotateY(Math.PI / 2);
            bucket.add(rail, matBank, mat4(px + ox, y + 1.0, pz + oz));
          });
        }
      }
      // 拱圈（券）：与桥面同心，置于桥面下方
      const arc = new THREE.TorusGeometry(R - 1.35, 0.95, 6, 30, 2 * A);
      arc.rotateZ(Math.PI / 2 - A);
      if (!alongX) arc.rotateY(Math.PI / 2);
      bucket.add(arc, matBank, mat4(cx, cy, cz));
      // 桥墩（分水尖）
      [-1, 1].forEach(s => {
        const px = alongX ? cx + s * (S / 2 - 1) : cx;
        const pz = alongX ? cz : cz + s * (S / 2 - 1);
        const pr = new THREE.BoxGeometry(3.4, 5.2, WIDTH + 1.6);
        if (!alongX) pr.rotateY(Math.PI / 2);
        bucket.add(pr, matBank, mat4(px, -1.2, pz));
      });

      bucket.build(world);
      bridges.push({
        cx, cz, alongX, R, A, deckY,
        hx: alongX ? S / 2 + 2 : WIDTH / 2 + 1,
        hz: alongX ? WIDTH / 2 + 1 : S / 2 + 2
      });
    }

    // 每两条街区之间架桥
    RIVERS_X.forEach(rx => {
      [-60, 60].forEach(z => { if (Math.random() < 0.75) makeBridge(rx, z, true); });
    });
    RIVERS_Z.forEach(rz => {
      [-60, 60].forEach(x => { if (Math.random() < 0.75) makeBridge(x, rz, false); });
    });

    // ============================================================
    //  共享实例化对象
    // ============================================================
    const DUMMY = new THREE.Object3D();

    const LANTERN_MAX = 1400;
    const lanternGeo = new THREE.CylinderGeometry(0.34, 0.34, 0.5, 8);
    lanternGeo.translate(0, -0.45, 0);
    const lanternMesh = new THREE.InstancedMesh(lanternGeo, matLantern, LANTERN_MAX);
    lanternMesh.frustumCulled = false;
    lanternMesh.castShadow = false;
    let lanternCount = 0;
    world.add(lanternMesh);
    const lanternSpots = [];
    function addLantern(x, y, z) {
      if (lanternCount >= LANTERN_MAX) return;
      lanternSpots.push([x, y, z]);
      DUMMY.position.set(x, y, z);
      DUMMY.rotation.set(0, rand(0, 6.28), 0);
      DUMMY.scale.setScalar(rand(0.85, 1.2));
      DUMMY.updateMatrix();
      lanternMesh.setMatrixAt(lanternCount++, DUMMY.matrix);
    }

    const TREE_MAX = 420;
    let treeCount = 0;
    const trunkGeo = new THREE.CylinderGeometry(0.24, 0.36, 3.2, 6);
    trunkGeo.translate(0, 1.6, 0);
    const crownGeo = new THREE.IcosahedronGeometry(2.1, 1);
    crownGeo.translate(0, 3.6, 0);
    const matTrunk = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 0.9 });
    const matCrown = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.85, flatShading: true });
    const trunkMesh = new THREE.InstancedMesh(trunkGeo, matTrunk, TREE_MAX);
    const crownMesh = new THREE.InstancedMesh(crownGeo, matCrown, TREE_MAX);
    trunkMesh.castShadow = crownMesh.castShadow = true;
    trunkMesh.frustumCulled = crownMesh.frustumCulled = false;
    world.add(trunkMesh, crownMesh);
    crownMesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(TREE_MAX * 3), 3);

    const GREENS = [0x4f8f3a, 0x3f7d34, 0x5aa345, 0x356b2a, 0x6ab04c];
    const BLOSSOM = [0xf2b8c6, 0xffc9d4, 0xe8a0b4];
    function addTree(x, z, s = 1, blossom = false) {
      if (treeCount >= TREE_MAX) return;
      const i = treeCount++;
      DUMMY.position.set(x, LAND_TOP, z);
      DUMMY.rotation.set(0, rand(0, 6.28), 0);
      DUMMY.scale.set(s, s * rand(0.85, 1.2), s);
      DUMMY.updateMatrix();
      trunkMesh.setMatrixAt(i, DUMMY.matrix);
      DUMMY.scale.set(s * rand(0.9, 1.25), s * rand(0.8, 1.1), s * rand(0.9, 1.25));
      DUMMY.rotation.y = rand(0, 6.28);
      DUMMY.updateMatrix();
      crownMesh.setMatrixAt(i, DUMMY.matrix);
      const c = new THREE.Color(blossom ? choice(BLOSSOM) : choice(GREENS));
      crownMesh.setColorAt(i, c);
    }

    // ============================================================
    //  建筑：白墙黛瓦民居
    // ============================================================
    const buildings = new THREE.Group();
    world.add(buildings);
    const colliders = [];        // 行走碰撞盒
    let houseCount = 0;

    // 一栋民居
    function makeHouse(cx, cz, w, d, rot, opt) {
      opt = opt || {};
      const g = new THREE.Group();
      const bucket = new Bucket();
      const floors = opt.floors || (Math.random() < 0.35 ? 2 : 1);
      const wallH = floors === 2 ? rand(6.0, 7.2) : rand(3.6, 4.8);
      const roofH = rand(2.0, 3.0);
      const stilt = !!opt.stilt;   // 水阁：木柱架空

      const baseY = 0;
      // 墙体
      const body = scaleBoxUV(new THREE.BoxGeometry(w, wallH, d), w, wallH, d);
      bucket.add(body, matWall, mat4(0, baseY + wallH / 2, 0));
      // 墙裙（石础）
      const plinth = scaleBoxUV(new THREE.BoxGeometry(w + 0.5, 0.6, d + 0.5), w + 0.5, 0.6, d + 0.5, 0.4);
      bucket.add(plinth, matBank, mat4(0, baseY + 0.3, 0));

      // 屋顶（屋脊沿 X）
      const rw = w * 1.16, rd = d * 1.16;
      bucket.add(roofPrism(rw, roofH, rd), matTile, mat4(0, baseY + wallH, 0));
      // 屋脊压顶
      const ridge = scaleBoxUV(new THREE.BoxGeometry(rw + 0.4, 0.36, 0.6), rw, 0.36, 0.6, 0.5);
      bucket.add(ridge, matTile, mat4(0, baseY + wallH + roofH + 0.05, 0));
      // 飞檐翘角
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => {
        const tip = scaleBoxUV(new THREE.BoxGeometry(1.6, 0.3, 0.9), 1.6, 0.3, 0.9, 0.6);
        bucket.add(tip, matTile,
          mat4(sx * (rw / 2 + 0.4), baseY + wallH + 0.45, sz * (rd / 2 + 0.2), 0, 0, sx * sz * 0.32));
      });

      // 马头墙（徽派阶梯山墙，沿 Z 两端）
      if (Math.random() < 0.55) {
        [-1, 1].forEach(s => {
          const steps = 3;
          for (let k = 0; k < steps; k++) {
            const hh = wallH + roofH * (0.35 + k * 0.24);
            const bw2 = w * (1.05 - k * 0.16);
            const mg = scaleBoxUV(new THREE.BoxGeometry(bw2, hh, 0.5), bw2, hh, 0.5);
            bucket.add(mg, matWhite, mat4(0, baseY + hh / 2, s * (d / 2 + 0.25 + k * 0.0)));
          }
        });
      }

      // 门脸（临巷一面）
      const shopKind = randInt(0, 2);
      const fw = w * (shopKind === 0 ? 0.78 : 0.62), fh = Math.min(wallH - 0.9, floors === 2 ? 5.6 : 3.4);
      const front = new THREE.PlaneGeometry(fw, fh);
      const fuv = front.attributes.uv;
      for (let i = 0; i < fuv.count; i++) fuv.setXY(i, fuv.getX(i) * fw * 0.3, fuv.getY(i) * fh * 0.3);
      fuv.needsUpdate = true;
      const faceDir = opt.face ?? choice([0, Math.PI / 2, Math.PI, -Math.PI / 2]);
      const fx = Math.sin(faceDir) * (d / 2 + 0.04);
      const fz = Math.cos(faceDir) * (d / 2 + 0.04);
      bucket.add(front, shopMats[shopKind], mat4(fx, baseY + fh / 2 + 0.45, fz, 0, faceDir, 0));

      // 木构：檐下横梁 + 立柱
      bucket.add(scaleBoxUV(new THREE.BoxGeometry(w + 0.3, 0.28, 0.5), w, 0.28, 0.5, 0.5),
        matWood, mat4(fx * 0.9, baseY + wallH - 0.2, fz * 0.9, 0, faceDir, 0));
      if (floors === 2) {
        bucket.add(scaleBoxUV(new THREE.BoxGeometry(w + 0.9, 0.3, 0.6), w, 0.3, 0.6, 0.5),
          matWood, mat4(fx * 0.9, baseY + wallH * 0.52, fz * 0.9, 0, faceDir, 0));
      }

      // 水阁：底层木柱撑在水面上
      if (stilt) {
        for (let i = 0; i < 4; i++) {
          const px = (i % 2 ? 1 : -1) * (w / 2 - 0.8);
          const pz = (i < 2 ? 1 : -1) * (d / 2 - 0.8);
          bucket.add(new THREE.CylinderGeometry(0.22, 0.24, LAND_TOP + 2.6, 6),
            matWood, mat4(px, baseY - (LAND_TOP + 2.6) / 2 - 0.2, pz));
        }
      }

      bucket.build(g);

      // 世界坐标变换
      g.position.set(cx, LAND_TOP, cz);
      g.rotation.y = rot;
      buildings.add(g);

      // 旋转后的世界包围盒（rot 为 0 或 90°，直接按旋转换算半宽半深）
      const cR = Math.abs(Math.cos(rot)), sR = Math.abs(Math.sin(rot));
      const hw = (w * cR + d * sR) / 2 + 0.3;
      const hd = (w * sR + d * cR) / 2 + 0.3;
      colliders.push({ x: cx, z: cz, w: hw * 2, d: hd * 2 });
      houseCount++;

      // 屋檐灯笼两盏（挂在门脸一侧）
      const lx = Math.sin(faceDir) * (d / 2 + 0.5), lz = Math.cos(faceDir) * (d / 2 + 0.5);
      const cosR = Math.cos(rot), sinR = Math.sin(rot);
      const wy = LAND_TOP + wallH - 0.55;
      [-1, 1].forEach(s => {
        const ox = lx + s * (fw * 0.32) * Math.cos(faceDir);
        const oz = lz - s * (fw * 0.32) * Math.sin(faceDir);
        addLantern(cx + ox * cosR + oz * sinR, wy, cz - ox * sinR + oz * cosR);
      });
      return g;
    }

    // 街区细分：巷 - 院 - 房
    const CELL = 26, LANE = 7.5;
    const PAGODA_BLOCK = { i: 3, j: 3 };    // 东南角建塔
    const PLAZA_BLOCK = { i: 1, j: 1 };     // 西北内块做市集广场
    const roadPaths = [];                    // 行人巷线

    blocks.forEach(b => {
      const isPagoda = b.i === PAGODA_BLOCK.i && b.j === PAGODA_BLOCK.j;
      const isPlaza = b.i === PLAZA_BLOCK.i && b.j === PLAZA_BLOCK.j;

      const usableW = b.w - 7, usableD = b.d - 7;
      const nx = Math.max(2, Math.floor((usableW + LANE) / (CELL + LANE)));
      const nz = Math.max(2, Math.floor((usableD + LANE) / (CELL + LANE)));
      const cw = (usableW - (nx - 1) * LANE) / nx;
      const cd = (usableD - (nz - 1) * LANE) / nz;
      const x0 = b.cx - (nx * cw + (nx - 1) * LANE) / 2 + cw / 2;
      const z0 = b.cz - (nz * cd + (nz - 1) * LANE) / 2 + cd / 2;

      if (isPlaza) { // 市集广场：留白 + 牌坊 + 摊位
        buildPlaza(b);
      }

      for (let ix = 0; ix < nx; ix++) {
        for (let iz = 0; iz < nz; iz++) {
          const px = x0 + ix * (cw + LANE);
          const pz = z0 + iz * (cd + LANE);
          if (isPagoda && Math.hypot(px - b.cx, pz - b.cz) < 34) continue;
          if (isPlaza && Math.hypot(px - b.cx, pz - b.cz) < 30) continue;
          if (Math.random() > 0.88) continue;

          // 临水判断：靠近街区边缘即临河
          const nearWater = Math.min(
            Math.abs(px - b.minX), Math.abs(px - b.maxX),
            Math.abs(pz - b.minZ), Math.abs(pz - b.maxZ)
          ) < cw * 0.75;

          const w = rand(cw * 0.45, cw * 0.82);
          const d = rand(cd * 0.45, cd * 0.82);
          const rot = choice([0, Math.PI / 2]);
          makeHouse(px, pz, w, d, rot, {
            floors: Math.random() < 0.32 ? 2 : 1,
            stilt: nearWater && Math.random() < 0.4,
            face: choice([0, Math.PI / 2, Math.PI, -Math.PI / 2])
          });

          // 厢房 / 耳房
          if (Math.random() < 0.3) {
            const aw = rand(4, 7), ad = rand(4, 6.5);
            const ox = (Math.random() < 0.5 ? -1 : 1) * (w / 2 + aw / 2 + 1.2);
            const oz = rand(-d / 3, d / 3);
            if (Math.abs(ox) < cw * 0.5) makeHouse(px + ox, pz + oz, aw, ad, rot, { floors: 1 });
          }
        }
      }

      // 巷线（行人）
      for (let ix = 0; ix <= nx; ix++) {
        const lx = clamp(x0 - cw / 2 - LANE / 2 + ix * (cw + LANE), b.minX + 2, b.maxX - 2);
        roadPaths.push({
          a: new THREE.Vector3(lx, 0, b.minZ + 2),
          b: new THREE.Vector3(lx, 0, b.maxZ - 2)
        });
      }
      for (let iz = 0; iz <= nz; iz++) {
        const lz = z0 - cd / 2 + iz * (cd + LANE) - LANE / 2;
        roadPaths.push({
          a: new THREE.Vector3(b.minX + 2, 0, clamp(lz, b.minZ + 2, b.maxZ - 2)),
          b: new THREE.Vector3(b.maxX - 2, 0, clamp(lz, b.minZ + 2, b.maxZ - 2))
        });
      }
      // 滨水步道（环岸一圈）
      const m = 3.2;
      roadPaths.push({ a: new THREE.Vector3(b.minX + m, 0, b.minZ + m), b: new THREE.Vector3(b.maxX - m, 0, b.minZ + m) });
      roadPaths.push({ a: new THREE.Vector3(b.maxX - m, 0, b.minZ + m), b: new THREE.Vector3(b.maxX - m, 0, b.maxZ - m) });
      roadPaths.push({ a: new THREE.Vector3(b.maxX - m, 0, b.maxZ - m), b: new THREE.Vector3(b.minX + m, 0, b.maxZ - m) });
      roadPaths.push({ a: new THREE.Vector3(b.minX + m, 0, b.maxZ - m), b: new THREE.Vector3(b.minX + m, 0, b.minZ + m) });
    });

    // ============================================================
    //  地标：宝塔 / 牌坊 / 市集 / 水车 / 水阁茶肆
    // ============================================================
    function makePagoda(x, z) {
      const g = new THREE.Group();
      const bucket = new Bucket();
      // 台基
      bucket.add(scaleBoxUV(new THREE.CylinderGeometry(15, 17, 2.4, 8), 15, 2.4, 15, 0.2),
        matBank, mat4(0, 1.2, 0));
      let r = 9.5, y = 2.4;
      const LEVELS = 7;
      for (let i = 0; i < LEVELS; i++) {
        const hh = 6.2 - i * 0.35;
        // 塔身（六角）
        const body = new THREE.CylinderGeometry(r * 0.88, r, hh, 6);
        const buv = body.attributes.uv;
        for (let k = 0; k < buv.count; k++) buv.setXY(k, buv.getX(k) * r * 0.5, buv.getY(k) * hh * 0.28);
        buv.needsUpdate = true;
        bucket.add(body, matWhite, mat4(0, y + hh / 2, 0));
        // 腰檐（六角攒尖）
        const eave = new THREE.CylinderGeometry(r * 1.62, r * 1.05, 0.85, 6);
        const euv = eave.attributes.uv;
        for (let k = 0; k < euv.count; k++) euv.setXY(k, euv.getX(k) * r * 0.7, euv.getY(k) * 1.2);
        euv.needsUpdate = true;
        bucket.add(eave, matTile, mat4(0, y + hh + 0.42, 0));
        // 檐角起翘
        for (let k = 0; k < 6; k++) {
          const a = (k / 6) * Math.PI * 2 + Math.PI / 6;
          bucket.add(scaleBoxUV(new THREE.BoxGeometry(1.5, 0.32, 2.4), 1.5, 0.32, 2.4, 0.6),
            matTile, mat4(Math.cos(a) * r * 1.55, y + hh + 0.72, Math.sin(a) * r * 1.55, 0, -a, 0.26));
        }
        // 门窗（发光）
        const dir = (i * 1.1);
        const win = new THREE.PlaneGeometry(r * 0.9, hh * 0.42);
        const wuv = win.attributes.uv;
        for (let k = 0; k < wuv.count; k++) wuv.setXY(k, wuv.getX(k) * r * 0.3, wuv.getY(k) * hh * 0.3);
        wuv.needsUpdate = true;
        bucket.add(win, shopMats[2], mat4(Math.sin(dir) * r * 0.9, y + hh * 0.55, Math.cos(dir) * r * 0.9, 0, dir, 0));
        y += hh + 1.1;
        r *= 0.9;
      }
      // 塔刹
      bucket.add(new THREE.CylinderGeometry(0.5, 1.4, 7, 8), matTile, mat4(0, y + 3, 0));
      bucket.add(new THREE.SphereGeometry(1.3, 10, 10), matTile, mat4(0, y + 7, 0));
      bucket.build(g);
      g.position.set(x, LAND_TOP, z);
      world.add(g);
      colliders.push({ x, z, w: 30, d: 30 });
      // 檐角灯笼
      for (let i = 0; i < 5; i++) addLantern(x + rand(-11, 11), LAND_TOP + 3 + i * 6, z + rand(-11, 11));
      return g;
    }

    function makeArchway(x, z, rot) {
      const g = new THREE.Group();
      const bucket = new Bucket();
      const H = 8.5, SPAN = 9;
      [-1, 1].forEach(s => {
        bucket.add(scaleBoxUV(new THREE.BoxGeometry(1.5, H, 1.5), 1.5, H, 1.5, 0.3),
          matBank, mat4(s * SPAN / 2, H / 2, 0));
        bucket.add(scaleBoxUV(new THREE.BoxGeometry(2.4, 0.7, 2.4), 2.4, 0.7, 2.4, 0.3),
          matBank, mat4(s * SPAN / 2, 0.35, 0));
      });
      bucket.add(scaleBoxUV(new THREE.BoxGeometry(SPAN + 3, 1.3, 1.2), SPAN, 1.3, 1.2, 0.3),
        matWood, mat4(0, H * 0.72, 0));
      bucket.add(scaleBoxUV(new THREE.BoxGeometry(SPAN + 2, 0.9, 1.0), SPAN, 0.9, 1, 0.3),
        matWood, mat4(0, H * 0.52, 0));
      // 牌坊小屋顶
      bucket.add(roofPrism(SPAN + 4.5, 1.5, 2.6), matTile, mat4(0, H * 0.79, 0));
      bucket.build(g);
      g.position.set(x, LAND_TOP, z);
      g.rotation.y = rot;
      world.add(g);
      addLantern(x - Math.sin(rot) * 3, LAND_TOP + H * 0.5, z - Math.cos(rot) * 3);
      addLantern(x + Math.sin(rot) * 3, LAND_TOP + H * 0.5, z + Math.cos(rot) * 3);
      return g;
    }

    function buildPlaza(b) {
      const cx = b.cx, cz = b.cz;
      // 铺地
      const pave = scaleBoxUV(new THREE.BoxGeometry(b.w - 10, 0.22, b.d - 10), b.w, 0.22, b.d, 0.2);
      const bucket = new Bucket();
      bucket.add(pave, matStone, mat4(cx, LAND_TOP + 0.11, cz));
      bucket.build(world);
      makeArchway(cx, cz - (b.d / 2 - 12), 0);
      makeArchway(cx, cz + (b.d / 2 - 12), 0);
      // 摊位：木架 + 布篷
      const stalls = new Bucket();
      for (let i = 0; i < 12; i++) {
        const sx = cx + rand(-b.w / 2 + 12, b.w / 2 - 12);
        const sz = cz + rand(-b.d / 2 + 12, b.d / 2 - 12);
        if (Math.abs(sx - cx) < 8 && Math.abs(sz - cz) < 8) continue;
        const sw = rand(2.6, 4.2), sd = rand(2, 3);
        stalls.add(scaleBoxUV(new THREE.BoxGeometry(sw, 0.9, sd), sw, 0.9, sd, 0.4),
          matWood, mat4(sx, LAND_TOP + 0.9, sz, 0, rand(0, 3.14), 0));
        stalls.add(new THREE.ConeGeometry(sw * 0.95, 1.3, 4),
          new THREE.MeshStandardMaterial({ color: choice([0xb9c4c0, 0xc8b89a, 0xa8b4bd]), roughness: 0.9 }),
          mat4(sx, LAND_TOP + 1.9, sz, 0, Math.PI / 4, 0));
        addLantern(sx, LAND_TOP + 2.3, sz);
      }
      stalls.build(world);
      // 广场树
      for (let i = 0; i < 6; i++) addTree(cx + rand(-30, 30), cz + rand(-30, 30), rand(1, 1.4));
    }

    // 水车
    const wheels = [];
    function makeWaterWheel(x, z, rot) {
      const g = new THREE.Group();
      const spin = new THREE.Group();
      const bucket = new Bucket();
      const R = 5.6;
      // 轮辋（轴向 Z：先转 90° 再整体偏航）
      const rim = new THREE.CylinderGeometry(R, R, 0.45, 18);
      rim.rotateX(Math.PI / 2);
      bucket.add(rim, matWood, mat4(0, 0, 0));
      const rim2 = new THREE.CylinderGeometry(R * 0.82, R * 0.82, 0.35, 14);
      rim2.rotateX(Math.PI / 2);
      bucket.add(rim2, matWood, mat4(0, 0, 0));
      for (let i = 0; i < 10; i++) {
        const a = (i / 10) * Math.PI * 2;
        // 辐条：在 XY 平面内绕 Z 转
        const spoke = new THREE.BoxGeometry(0.28, R * 2, 0.28);
        spoke.rotateZ(a);
        bucket.add(spoke, matWood, mat4(0, 0, 0));
        // 水斗
        const paddle = new THREE.BoxGeometry(1.5, 0.24, 1.2);
        paddle.rotateZ(a + Math.PI / 2);
        bucket.add(paddle, matWoodDark, mat4(Math.cos(a) * (R - 0.6), Math.sin(a) * (R - 0.6), 0));
      }
      const axle = new THREE.CylinderGeometry(0.5, 0.5, 2.4, 8);
      axle.rotateX(Math.PI / 2);
      bucket.add(axle, matWood, mat4(0, 0, 0));
      bucket.build(spin);

      // 支架（固定，不随轮转）
      const frame = new Bucket();
      [-1, 1].forEach(s => {
        frame.add(new THREE.BoxGeometry(0.7, 10, 0.7), matWoodDark, mat4(s * 2.0, -2.6, -1.5));
      });
      frame.add(new THREE.BoxGeometry(5.4, 0.6, 0.8), matWoodDark, mat4(0, -6.6, -1.5));
      frame.build(g);
      g.add(spin);
      g.position.set(x, LAND_TOP + 3.4, z);
      g.rotation.y = rot;
      world.add(g);
      wheels.push(spin);
      return g;
    }

    // 塔 / 水车 / 茶肆落位
    const pagodaBlock = blocks.find(b => b.i === PAGODA_BLOCK.i && b.j === PAGODA_BLOCK.j);
    if (pagodaBlock) makePagoda(pagodaBlock.cx, pagodaBlock.cz);
    blocks.filter(b => b.i === 0 || b.j === 0).slice(0, 3).forEach((b, k) => {
      const alongX = k % 2 === 0;
      makeWaterWheel(
        alongX ? b.cx : (b.i === 0 ? b.minX - 1.5 : b.maxX + 1.5),
        alongX ? (b.j === 0 ? b.minZ - 1.5 : b.maxZ + 1.5) : b.cz,
        alongX ? 0 : Math.PI / 2
      );
    });

    // ============================================================
    //  植被（InstancedMesh）
    // ============================================================
    // 实例化对象已提前创建；这里只布点
    const willowSegs = [];
    blocks.forEach(b => {
      const n = 5;
      for (let k = 0; k < n; k++) {
        const t = (k + rand(0.1, 0.9)) / n;
        const side = Math.random() < 0.5;
        // 沿四条边分布，靠近水的一侧种柳
        const alongX = Math.random() < 0.5;
        let x, z;
        if (alongX) { x = lerp(b.minX + 5, b.maxX - 5, t); z = side ? b.minZ + 3.4 : b.maxZ - 3.4; }
        else { z = lerp(b.minZ + 5, b.maxZ - 5, t); x = side ? b.minX + 3.4 : b.maxX - 3.4; }
        if (Math.random() < 0.55) { addTree(x, z, rand(0.85, 1.15)); willowSegs.push([x, z, rand(0.9, 1.2)]); }
      }
      // 巷中杂树
      for (let k = 0; k < 3; k++) {
        const x = b.cx + rand(-b.w / 2 + 8, b.w / 2 - 8);
        const z = b.cz + rand(-b.d / 2 + 8, b.d / 2 - 8);
        if (blockedForTree(x, z)) continue;
        addTree(x, z, rand(0.7, 1.1), Math.random() < 0.18);
      }
    });
    function blockedForTree(x, z) {
      for (const c of colliders)
        if (Math.abs(x - c.x) < c.w / 2 + 2 && Math.abs(z - c.z) < c.d / 2 + 2) return true;
      return false;
    }
    trunkMesh.count = crownMesh.count = treeCount;
    trunkMesh.instanceMatrix.needsUpdate = crownMesh.instanceMatrix.needsUpdate = true;
    if (crownMesh.instanceColor) crownMesh.instanceColor.needsUpdate = true;

    // 垂柳枝条（合并成一批线段）
    (function willowBranches() {
      const pts = [];
      willowSegs.forEach(([x, z, s]) => {
        for (let i = 0; i < 9; i++) {
          const a = rand(0, Math.PI * 2), r = rand(0.8, 2.2);
          const bx = x + Math.cos(a) * r, bz = z + Math.sin(a) * r;
          const top = LAND_TOP + 4.6 * s + rand(-0.4, 0.6);
          const len = rand(1.6, 3.2) * s;
          let px = bx, py = top, pz = bz;
          for (let k = 0; k < 4; k++) {
            const nx2 = px + rand(-0.5, 0.5), ny2 = py - len / 4, nz2 = pz + rand(-0.5, 0.5);
            pts.push(px, py, pz, nx2, ny2, nz2);
            px = nx2; py = ny2; pz = nz2;
          }
        }
      });
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      const m = new THREE.LineBasicMaterial({ color: 0x6f9c4a, transparent: true, opacity: 0.9 });
      const lines = new THREE.LineSegments(g, m);
      lines.frustumCulled = false;
      world.add(lines);
    })();

    // 沿河灯笼串（灯 + 连线）
    (function riverLanterns() {
      const pts = [];
      blocks.forEach(b => {
        const edges = [
          { alongX: true, z: b.minZ + 3.0 }, { alongX: true, z: b.maxZ - 3.0 },
          { alongX: false, x: b.minX + 3.0 }, { alongX: false, x: b.maxX - 3.0 }
        ];
        edges.forEach(e => {
          if (Math.random() < 0.5) return;
          const from = e.alongX ? b.minX + 8 : b.minZ + 8;
          const to = e.alongX ? b.maxX - 8 : b.maxZ - 8;
          let prev = null;
          for (let v = from; v <= to; v += 7) {
            const x = e.alongX ? v : e.x, z = e.alongX ? e.z : v;
            const y = LAND_TOP + 5.2 + Math.sin(v * 0.06) * 0.5;
            addLantern(x, y, z);
            const cur = new THREE.Vector3(x, y + 0.5, z);
            if (prev) pts.push(prev.x, prev.y, prev.z, cur.x, cur.y, cur.z);
            prev = cur;
          }
        });
      });
      if (!pts.length) return;
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
      world.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x2a2320 })));
    })();

    lanternMesh.count = lanternCount;
    lanternMesh.instanceMatrix.needsUpdate = true;

    // ============================================================
    //  乌篷船
    // ============================================================
    const boats = [];
    const boatPaths = [];
    RIVERS_X.forEach(rx => {
      boatPaths.push({ a: new THREE.Vector3(rx + 4.5, WATER_Y, -CITY + 10), b: new THREE.Vector3(rx + 4.5, WATER_Y, CITY - 10), alongX: false });
      boatPaths.push({ a: new THREE.Vector3(rx - 4.5, WATER_Y, CITY - 10), b: new THREE.Vector3(rx - 4.5, WATER_Y, -CITY + 10), alongX: false });
    });
    RIVERS_Z.forEach(rz => {
      boatPaths.push({ a: new THREE.Vector3(-CITY + 10, WATER_Y, rz + 4.5), b: new THREE.Vector3(CITY - 10, WATER_Y, rz + 4.5), alongX: true });
      boatPaths.push({ a: new THREE.Vector3(CITY - 10, WATER_Y, rz - 4.5), b: new THREE.Vector3(-CITY + 10, WATER_Y, rz - 4.5), alongX: true });
    });

    function makeBoat() {
      const g = new THREE.Group();
      const hullMat = new THREE.MeshStandardMaterial({ map: woodTex, color: 0x8a6a4a, roughness: 0.75 });
      const hull = new THREE.Mesh(new THREE.CylinderGeometry(1.55, 1.15, 9.5, 4, 1), hullMat);
      hull.rotation.set(Math.PI / 2, 0, Math.PI / 4);
      hull.scale.set(1, 1, 0.55);
      hull.position.y = 0.55;
      hull.castShadow = true;
      g.add(hull);
      // 乌篷（半圆）
      const canopy = new THREE.Mesh(
        new THREE.CylinderGeometry(1.5, 1.5, 4.6, 12, 1, false, 0, Math.PI),
        new THREE.MeshStandardMaterial({ color: 0x2e2a26, roughness: 0.95 })
      );
      canopy.rotation.set(Math.PI / 2, 0, Math.PI);
      canopy.position.set(0, 1.05, -0.9);
      canopy.castShadow = true;
      g.add(canopy);
      // 船尾橹
      const oar = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.14, 4.2), matWoodDark);
      oar.position.set(0.7, 1.0, -4.0);
      oar.rotation.set(0.35, 0.4, 0);
      g.add(oar);
      // 船灯
      const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 8), matLantern);
      lamp.position.set(0, 1.5, 3.6);
      g.add(lamp);
      return g;
    }
    boatPaths.forEach(p => {
      const n = randInt(1, 2);
      for (let i = 0; i < n; i++) {
        const b = makeBoat();
        const t = Math.random();
        b.position.lerpVectors(p.a, p.b, t);
        const dir = new THREE.Vector3().subVectors(p.b, p.a).normalize();
        b.rotation.y = Math.atan2(dir.x, dir.z);
        world.add(b);
        boats.push({ mesh: b, path: p, t, speed: rand(0.008, 0.016), phase: rand(0, 6.28) });
      }
    });

    // ============================================================
    //  行人（InstancedMesh + 雨天撑伞）
    // ============================================================
    const PED_MAX = 320;
    const pedList = [];
    const pedTorso = new THREE.InstancedMesh(new THREE.CapsuleGeometry(0.26, 0.62, 4, 8),
      new THREE.MeshStandardMaterial({ roughness: 0.75 }), PED_MAX);
    const pedHead = new THREE.InstancedMesh(new THREE.SphereGeometry(0.21, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0xe0b48c, roughness: 0.6 }), PED_MAX);
    const umbrellaGeo = new THREE.ConeGeometry(0.85, 0.5, 10);
    umbrellaGeo.translate(0, 1.72, 0);
    const pedUmbrella = new THREE.InstancedMesh(umbrellaGeo,
      new THREE.MeshStandardMaterial({ color: 0xd9dde0, roughness: 0.6, side: THREE.DoubleSide }), PED_MAX);
    [pedTorso, pedHead, pedUmbrella].forEach(m => { m.frustumCulled = false; m.castShadow = true; world.add(m); });
    pedTorso.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(PED_MAX * 3), 3);
    pedUmbrella.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(PED_MAX * 3), 3);
    const PED_COLORS = [0x39424e, 0x5b6b7a, 0x7a5c4a, 0x4a5a48, 0x8a6a6a, 0x2f3b48, 0x6d7f8d, 0xa89a86];
    const UMB_COLORS = [0xd9dde0, 0xc0503f, 0x4a6b8a, 0xe0c070, 0x8a8f96];

    roadPaths.forEach(p => {
      const len = p.a.distanceTo(p.b);
      if (len < 12) return;
      const n = randInt(1, 3);
      for (let i = 0; i < n && pedList.length < PED_MAX; i++) {
        pedList.push({
          path: p, t: Math.random(), dir: Math.random() < 0.5 ? 1 : -1,
          speed: rand(0.012, 0.028) / Math.max(6, len) * 22, bob: rand(0, 6.28),
          color: choice(PED_COLORS), umb: choice(UMB_COLORS), scale: rand(0.92, 1.1)
        });
      }
    });
    // 颜色只写一次（避免每帧重传 instanceColor）
    (function initPedColors() {
      const c = new THREE.Color();
      pedList.forEach((p, i) => {
        pedTorso.setColorAt(i, c.setHex(p.color));
        pedUmbrella.setColorAt(i, c.setHex(p.umb));
      });
      if (pedTorso.instanceColor) pedTorso.instanceColor.needsUpdate = true;
      if (pedUmbrella.instanceColor) pedUmbrella.instanceColor.needsUpdate = true;
    })();

    // ============================================================
    //  烟雨
    // ============================================================
    let rainOn = false;
    const RAIN_N = 4200, RAIN_AREA = 150, RAIN_H = 90;
    const rainGeo = new THREE.BufferGeometry();
    const rainPos = new Float32Array(RAIN_N * 6);
    for (let i = 0; i < RAIN_N; i++) {
      const x = rand(-RAIN_AREA, RAIN_AREA), y = rand(0, RAIN_H), z = rand(-RAIN_AREA, RAIN_AREA);
      const len = rand(0.9, 1.9);
      rainPos[i * 6 + 0] = x; rainPos[i * 6 + 1] = y; rainPos[i * 6 + 2] = z;
      rainPos[i * 6 + 3] = x + 0.18; rainPos[i * 6 + 4] = y - len; rainPos[i * 6 + 5] = z;
    }
    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
    const rain = new THREE.LineSegments(rainGeo,
      new THREE.LineBasicMaterial({ color: 0xbcd6e8, transparent: true, opacity: 0.42 }));
    rain.visible = false;
    rain.frustumCulled = false;
    scene.add(rain);

    // ============================================================
    //  时辰 / 天气
    // ============================================================
    let timeOfDay = 8.0, timeScale = 0.06;
    const SHICHEN = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    const tmpV = new THREE.Vector3();

    const shichenEl = document.getElementById('shichen');
    const clockEl = document.getElementById('clock');
    const weatherEl = document.getElementById('weather');
    const modeEl = document.getElementById('hud-tr');

    function updateEnvironment(dt) {
      timeOfDay = (timeOfDay + dt * timeScale) % 24;
      const t = timeOfDay;
      const elev = Math.sin((t / 24) * Math.PI * 2 - Math.PI / 2);
      const dayF = clamp(elev, 0, 1);
      const nightF = 1 - dayF;

      const phi = Math.acos(clamp(elev, -1, 1));
      const theta = (t / 24) * Math.PI * 2 + Math.PI;
      sunDir.setFromSphericalCoords(1, phi, theta);
      skyU['sunPosition'].value.copy(sunDir);
      sunLight.position.copy(sunDir).multiplyScalar(600);
      sunLight.target.position.set(0, 0, 0);
      sunLight.intensity = Math.max(0, elev) * 3.2;
      sunLight.color.setHSL(0.09 + dayF * 0.02, 0.55 - dayF * 0.32, 0.52 + dayF * 0.28);
      hemi.intensity = 0.28 + dayF * 0.55;
      ambient.intensity = 0.2 + dayF * 0.28;
      moonLight.intensity = nightF * 0.55;

      // 天色 / 雾
      const cNight = new THREE.Color(0x0d1726);
      const cDawn = new THREE.Color(0xf0b48c);
      const cDay = new THREE.Color(0xa9c6d6);
      const cDusk = new THREE.Color(0xe8a06e);
      let skyCol;
      if (t < 5) skyCol = cNight.clone();
      else if (t < 7.5) skyCol = cNight.clone().lerp(cDawn, (t - 5) / 2.5);
      else if (t < 9) skyCol = cDawn.clone().lerp(cDay, (t - 7.5) / 1.5);
      else if (t < 16) skyCol = cDay.clone();
      else if (t < 18.5) skyCol = cDay.clone().lerp(cDusk, (t - 16) / 2.5);
      else if (t < 20.5) skyCol = cDusk.clone().lerp(cNight, (t - 18.5) / 2);
      else skyCol = cNight.clone();
      if (rainOn) skyCol.lerp(new THREE.Color(0x8d9aa2), 0.35);
      scene.fog.color.copy(skyCol);
      scene.fog.density = (rainOn ? 0.0052 : 0.0015) + nightF * 0.0012;
      renderer.toneMappingExposure = 0.55 + dayF * 0.32 - (rainOn ? 0.05 : 0);

      // 灯火：窗 / 灯笼
      const litF = clamp(nightF * 1.15 + (rainOn ? 0.18 : 0), 0, 1.2);
      windowMats.forEach(m => { m.emissiveIntensity = 0.02 + litF * 1.05; });
      matLantern.emissiveIntensity = 0.06 + litF * 1.7;
      waterMat.color.setHSL(0.52, 0.28 - nightF * 0.12, lerp(0.34, 0.12, nightF));

      // HUD
      const hh = Math.floor(t).toString().padStart(2, '0');
      const mm = Math.floor((t % 1) * 60).toString().padStart(2, '0');
      clockEl.textContent = `${hh}:${mm}`;
      shichenEl.textContent = SHICHEN[Math.floor(((t + 1) % 24) / 2)] + '时';
      let wx = rainOn ? '烟雨江南' : (nightF > 0.7 ? '月色如洗' : (nightF > 0.25 ? '暮色沉沉' : (dayF > 0.7 ? '晴光潋滟' : '薄雾轻笼')));
      weatherEl.textContent = `${wx} · 巷陌 ${blocks.length} · 屋舍 ${houseCount}`;
    }

    // ============================================================
    //  相机：鸟瞰 / 漫步 / 泛舟
    // ============================================================
    let mode = 'bird';
    const keys = {};
    const walk = { pos: new THREE.Vector3(60, LAND_TOP + 1.7, 60), yaw: 0, pitch: 0, speed: 20 };
    let camY = walk.pos.y;

    // 出生点：挑一处不撞房子、不在水里的巷子，并朝向镇中心
    (function pickSpawn() {
      let best = null, bestD = Infinity;
      const tryPoint = (x, z) => {
        if (inWater(x, z) || hitBuilding(x, z)) return;
        const d = Math.hypot(x, z);
        if (d < bestD) { bestD = d; best = new THREE.Vector3(x, 0, z); }
      };
      for (const p of roadPaths) {
        [0.5, 0.3, 0.7, 0.15, 0.85].forEach(t => {
          tryPoint(lerp(p.a.x, p.b.x, t), lerp(p.a.z, p.b.z, t));
        });
      }
      if (!best && bridges.length) best = new THREE.Vector3(bridges[0].cx, 0, bridges[0].cz);
      if (best) {
        walk.pos.set(best.x, groundHeight(best.x, best.z) + 1.7, best.z);
        walk.yaw = Math.atan2(-best.x, -best.z);   // 面朝镇中心
        camY = walk.pos.y;
      }
    })();

    // 泛舟路线：沿河道闭合环
    const boatRoute = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-120, WATER_Y, -120), new THREE.Vector3(0, WATER_Y, -120),
      new THREE.Vector3(120, WATER_Y, -120), new THREE.Vector3(120, WATER_Y, 0),
      new THREE.Vector3(120, WATER_Y, 120), new THREE.Vector3(0, WATER_Y, 120),
      new THREE.Vector3(-120, WATER_Y, 120), new THREE.Vector3(-120, WATER_Y, 0)
    ], true, 'catmullrom', 0.02);
    let boatT = 0;

    addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (k === 'p') {
        e.preventDefault();
        mode = mode === 'bird' ? 'walk' : (mode === 'walk' ? 'boat' : 'bird');
        modeEl.textContent = mode === 'bird' ? '🚁 鸟瞰' : (mode === 'walk' ? '🚶 漫步' : '🚣 泛舟');
        if (mode === 'walk') {
          controls.enabled = false;
          camY = groundHeight(walk.pos.x, walk.pos.z) + 1.7;
          walk.pitch = 0;
          renderer.domElement.requestPointerLock();
        }
        else { controls.enabled = true; document.exitPointerLock(); }
        if (mode === 'bird') camera.position.set(190, 150, 235), controls.target.set(0, 8, 0);
      }
      if (k === 't') timeScale = timeScale > 0.1 ? 0.06 : 0.55;
      if (k === 'r') { rainOn = !rainOn; rain.visible = rainOn; }
    });
    addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    renderer.domElement.addEventListener('click', () => {
      if (mode === 'walk' && document.pointerLockElement !== renderer.domElement)
        renderer.domElement.requestPointerLock();
    });
    addEventListener('mousemove', e => {
      if (mode === 'walk' && document.pointerLockElement === renderer.domElement) {
        walk.yaw -= e.movementX * 0.0022;
        walk.pitch -= e.movementY * 0.0022;
        walk.pitch = clamp(walk.pitch, -Math.PI / 3, Math.PI / 3);
      }
    });

    function inWater(x, z) {
      for (const r of RIVERS_X) if (Math.abs(x - r) < R_HALF + 1.2) return true;
      for (const r of RIVERS_Z) if (Math.abs(z - r) < R_HALF + 1.2) return true;
      return false;
    }
    function onBridge(x, z) {
      return bridges.some(b => Math.abs(x - b.cx) < b.hx && Math.abs(z - b.cz) < b.hz);
    }
    function hitBuilding(x, z) {
      for (const c of colliders)
        if (Math.abs(x - c.x) < c.w / 2 + 0.35 && Math.abs(z - c.z) < c.d / 2 + 0.35) return true;
      return false;
    }
    // 桥面高度（拱桥中间高、两端接岸）
    function bridgeDeckY(b, x, z) {
      const t = b.alongX ? (x - b.cx) : (z - b.cz);
      const th = Math.asin(clamp(t / b.R, -1, 1));
      return b.deckY + (b.R * Math.cos(th) - b.R * Math.cos(b.A));
    }
    function groundHeight(x, z) {
      for (const b of bridges)
        if (Math.abs(x - b.cx) < b.hx && Math.abs(z - b.cz) < b.hz) return bridgeDeckY(b, x, z);
      return LAND_TOP;
    }
    const _p = new THREE.Vector3(), _t = new THREE.Vector3();

    function updateCamera(dt) {
      if (mode === 'bird') {
        controls.update();
        const pan = 70 * dt;
        const fwd = new THREE.Vector3(Math.sin(controls.getAzimuthalAngle()), 0, Math.cos(controls.getAzimuthalAngle()));
        const rt = new THREE.Vector3(fwd.z, 0, -fwd.x);
        if (keys['w'] || keys['arrowup']) controls.target.addScaledVector(fwd, -pan);
        if (keys['s'] || keys['arrowdown']) controls.target.addScaledVector(fwd, pan);
        if (keys['a'] || keys['arrowleft']) controls.target.addScaledVector(rt, -pan);
        if (keys['d'] || keys['arrowright']) controls.target.addScaledVector(rt, pan);
        controls.target.x = clamp(controls.target.x, -CITY, CITY);
        controls.target.z = clamp(controls.target.z, -CITY, CITY);
      } else if (mode === 'walk') {
        const fwd = new THREE.Vector3(Math.sin(walk.yaw), 0, Math.cos(walk.yaw));
        // 屏幕右方 = fwd × up （注意不是 up × fwd，否则 A/D 会反）
        const rt = new THREE.Vector3(-fwd.z, 0, fwd.x);
        const mv = new THREE.Vector3();
        if (keys['w'] || keys['arrowup']) mv.add(fwd);
        if (keys['s'] || keys['arrowdown']) mv.addScaledVector(fwd, -1);
        if (keys['a'] || keys['arrowleft']) mv.addScaledVector(rt, -1);
        if (keys['d'] || keys['arrowright']) mv.add(rt);
        if (mv.lengthSq() > 0) {
          mv.normalize();
          const nx = walk.pos.x + mv.x * walk.speed * dt;
          const nz = walk.pos.z + mv.z * walk.speed * dt;
          // 已经卡在碰撞盒内时放行，保证一定能走出来
          const stuck = hitBuilding(walk.pos.x, walk.pos.z);
          if (stuck) {
            walk.pos.x = nx; walk.pos.z = nz;
          } else {
            const okX = !(inWater(nx, walk.pos.z) && !onBridge(nx, walk.pos.z)) && !hitBuilding(nx, walk.pos.z);
            const okZ = !(inWater(walk.pos.x, nz) && !onBridge(walk.pos.x, nz)) && !hitBuilding(walk.pos.x, nz);
            if (okX) walk.pos.x = nx;
            if (okZ) walk.pos.z = nz;
          }
        }
        walk.pos.x = clamp(walk.pos.x, -CITY, CITY);
        walk.pos.z = clamp(walk.pos.z, -CITY, CITY);
        // 地面高度（上桥时抬升）并做平滑，避免台阶感
        const targetY = groundHeight(walk.pos.x, walk.pos.z) + 1.7;
        camY += (targetY - camY) * Math.min(1, dt * 8);
        camera.position.set(walk.pos.x, camY, walk.pos.z);
        tmpV.set(Math.sin(walk.yaw) * Math.cos(walk.pitch), Math.sin(walk.pitch), Math.cos(walk.yaw) * Math.cos(walk.pitch)).add(camera.position);
        camera.lookAt(tmpV);
      } else {
        boatT = (boatT + dt * 0.012) % 1;
        boatRoute.getPointAt(boatT, _p);
        boatRoute.getTangentAt(boatT, _t);
        camera.position.set(_p.x, WATER_Y + 2.5 + Math.sin(performance.now() * 0.001) * 0.12, _p.z);
        camera.lookAt(_p.x + _t.x * 12, WATER_Y + 2.4, _p.z + _t.z * 12);
      }
    }

    // ============================================================
    //  主循环
    // ============================================================
    let last = performance.now(), envTimer = 0;
    function animate(now) {
      requestAnimationFrame(animate);
      let dt = (now - last) / 1000; last = now;
      dt = clamp(dt, 0, 0.1);
      const tt = now * 0.001;

      updateEnvironment(dt);
      updateCamera(dt);
      waterUniforms.uTime.value = tt;

      // 船
      boats.forEach(b => {
        b.t += b.speed * dt;
        if (b.t > 1) b.t -= 1;
        b.mesh.position.lerpVectors(b.path.a, b.path.b, b.t);
        b.mesh.position.y = WATER_Y + Math.sin(tt * 1.4 + b.phase) * 0.12;
        b.mesh.rotation.z = Math.sin(tt * 0.9 + b.phase) * 0.035;
        b.mesh.rotation.y = Math.atan2(
          b.path.b.x - b.path.a.x, b.path.b.z - b.path.a.z) + Math.sin(tt * 0.7 + b.phase) * 0.02;
      });

      // 行人
      for (let i = 0; i < pedList.length; i++) {
        const p = pedList[i];
        p.t += p.speed * dt * p.dir;
        if (p.t > 1) { p.t = 1; p.dir = -1; }
        if (p.t < 0) { p.t = 0; p.dir = 1; }
        _p.lerpVectors(p.path.a, p.path.b, p.t);
        const yaw = Math.atan2(p.path.b.x - p.path.a.x, p.path.b.z - p.path.a.z) + (p.dir < 0 ? Math.PI : 0);
        const bob = Math.abs(Math.sin(tt * 6 + p.bob)) * 0.07;
        DUMMY.position.set(_p.x, LAND_TOP + bob, _p.z);
        DUMMY.rotation.set(0, yaw, Math.sin(tt * 6 + p.bob) * 0.03);
        DUMMY.scale.setScalar(p.scale);
        DUMMY.updateMatrix();
        pedTorso.setMatrixAt(i, DUMMY.matrix);
        DUMMY.position.y = LAND_TOP + bob + 1.02 * p.scale;
        DUMMY.updateMatrix();
        pedHead.setMatrixAt(i, DUMMY.matrix);
        if (rainOn) {
          DUMMY.position.y = LAND_TOP + bob;
          DUMMY.rotation.set(0, yaw + rand(-0.2, 0.2), 0);
          DUMMY.updateMatrix();
          pedUmbrella.setMatrixAt(i, DUMMY.matrix);
        }
      }
      pedTorso.count = pedHead.count = pedList.length;
      pedUmbrella.count = rainOn ? pedList.length : 0;
      pedUmbrella.visible = rainOn;
      pedTorso.instanceMatrix.needsUpdate = pedHead.instanceMatrix.needsUpdate = pedUmbrella.instanceMatrix.needsUpdate = true;

      // 水车
      wheels.forEach(w => { w.rotation.z -= dt * 0.55; });

      // 雨
      if (rainOn) {
        rain.position.set(Math.round(camera.position.x), -((tt * 34) % RAIN_H), Math.round(camera.position.z));
      }

      // 环境反射（低频刷新）
      envTimer += dt;
      if (envTimer > 5) { envTimer = 0; refreshEnv(); }

      renderer.render(scene, camera);
    }
    const _tmpColor = new THREE.Color();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // 启动
    refreshEnv();
    const loader = document.getElementById('loader');
    requestAnimationFrame(() => {
      animate(performance.now());
      loader.style.opacity = '0';
      setTimeout(() => loader.remove(), 1000);
    });
    console.log('🏞 江南水乡 · 烟雨古镇 已落成');
  </script>
</body>
</html>
