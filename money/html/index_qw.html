<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 纸币交互场景</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(to bottom, #f5f7fa, #e4e7eb);
            font-family: 'Arial', sans-serif;
            cursor: pointer;
        }
        
        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        #info {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #666;
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }
        
        #toolbar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            background: #4a90e2;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #3a7bc8;
            transform: translateY(-2px);
        }
        
        .btn.active {
            background: #e74c3c;
        }
        
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="info">拖拽纸币 · 方向键/WASD旋转视角 · 滚轮缩放</div>
        <div id="toolbar">
            <button id="windBtn" class="btn">开启吹风</button>
            <button id="resetBtn" class="btn">重置</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 主要变量
        let scene, camera, renderer;
        let paperMesh, paperBackMesh;
        let particles = [];
        let constraints = [];
        let ground;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let targetRotation = { x: 0, y: 0 };
        let currentRotation = { x: 0, y: 0 };
        let isDragging = false;
        let dragParticles = [];
        let dragPlane;
        let windEnabled = false;
        let clock = new THREE.Clock();

        // 物理参数
        const PAPER_WIDTH = 7.62; // cm
        const PAPER_HEIGHT = 16.51; // cm
        const GRID_X = 40;
        const GRID_Y = 24;
        const MASS = 0.01;
        const GRAVITY = -9.8;
        const DAMPING = 0.98;
        const DRAG_RADIUS = 1.5;
        const MAX_DRAG_DISTANCE = 5;

        // 初始化场景
        function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f7fa);
            scene.fog = new THREE.Fog(0xf5f7fa, 10, 20);

            // 创建相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            document.getElementById('container').appendChild(renderer.domElement);

            // 添加光源
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            scene.add(directionalLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
            fillLight.position.set(-5, 5, -5);
            scene.add(fillLight);

            // 创建地面
            const groundGeometry = new THREE.PlaneGeometry(20, 20);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xf0f0f0,
                roughness: 0.8,
                metalness: 0.0
            });
            ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            // 创建纸币
            createPaperBill();

            // 事件监听
            setupEventListeners();

            // 开始渲染循环
            animate();
        }

        // 创建纸币
        function createPaperBill() {
            // 创建粒子网格
            createParticleGrid();

            // 创建约束
            createConstraints();

            // 创建几何体和材质
            const geometry = new THREE.BufferGeometry();
            const positions = [];
            const uvs = [];
            const indices = [];

            // 生成顶点和UV
            for (let i = 0; i <= GRID_X; i++) {
                for (let j = 0; j <= GRID_Y; j++) {
                    const particle = particles[i * (GRID_Y + 1) + j];
                    positions.push(particle.position.x, particle.position.y, particle.position.z);
                    
                    // UV坐标
                    uvs.push(i / GRID_X, 1 - j / GRID_Y);
                }
            }

            // 生成面
            for (let i = 0; i < GRID_X; i++) {
                for (let j = 0; j < GRID_Y; j++) {
                    const a = i * (GRID_Y + 1) + j;
                    const b = (i + 1) * (GRID_Y + 1) + j;
                    const c = (i + 1) * (GRID_Y + 1) + j + 1;
                    const d = i * (GRID_Y + 1) + j + 1;

                    indices.push(a, b, d);
                    indices.push(b, c, d);
                }
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
            geometry.setIndex(indices);

            // 创建纹理
            const frontTexture = generateBillTexture(true);
            const backTexture = generateBillTexture(false);
            
            // 正面材质
            const frontMaterial = new THREE.MeshPhysicalMaterial({
                map: frontTexture,
                side: THREE.FrontSide,
                roughness: 0.8,
                metalness: 0.0,
                clearcoat: 0.05,
                bumpScale: 0.01
            });

            // 背面材质
            const backMaterial = new THREE.MeshPhysicalMaterial({
                map: backTexture,
                side: THREE.BackSide,
                roughness: 0.8,
                metalness: 0.0,
                clearcoat: 0.05,
                bumpScale: 0.01
            });

            // 创建网格
            paperMesh = new THREE.Mesh(geometry, frontMaterial);
            paperBackMesh = new THREE.Mesh(geometry, backMaterial);
            
            paperMesh.castShadow = true;
            paperBackMesh.castShadow = true;
            
            scene.add(paperMesh);
            scene.add(paperBackMesh);
        }

        // 创建粒子网格
        function createParticleGrid() {
            particles = [];
            
            const halfWidth = PAPER_WIDTH / 2;
            const halfHeight = PAPER_HEIGHT / 2;
            
            for (let i = 0; i <= GRID_X; i++) {
                for (let j = 0; j <= GRID_Y; j++) {
                    const x = (i / GRID_X - 0.5) * PAPER_WIDTH;
                    const y = 0; // 初始Y位置为0
                    const z = (j / GRID_Y - 0.5) * PAPER_HEIGHT;
                    
                    const particle = {
                        position: new THREE.Vector3(x, y, z),
                        oldPosition: new THREE.Vector3(x, y, z),
                        acceleration: new THREE.Vector3(0, GRAVITY, 0),
                        invMass: 1 / MASS,
                        pinned: false
                    };
                    
                    particles.push(particle);
                }
            }
        }

        // 创建约束
        function createConstraints() {
            constraints = [];
            
            // 结构约束（相邻粒子）
            for (let i = 0; i <= GRID_X; i++) {
                for (let j = 0; j <= GRID_Y; j++) {
                    if (i < GRID_X) {
                        // X方向约束
                        constraints.push({
                            p1: i * (GRID_Y + 1) + j,
                            p2: (i + 1) * (GRID_Y + 1) + j,
                            restLength: PAPER_WIDTH / GRID_X,
                            stiffness: 0.8
                        });
                    }
                    
                    if (j < GRID_Y) {
                        // Y方向约束
                        constraints.push({
                            p1: i * (GRID_Y + 1) + j,
                            p2: i * (GRID_Y + 1) + (j + 1),
                            restLength: PAPER_HEIGHT / GRID_Y,
                            stiffness: 0.8
                        });
                    }
                }
            }
            
            // 剪切约束（对角线）
            for (let i = 0; i < GRID_X; i++) {
                for (let j = 0; j < GRID_Y; j++) {
                    // 右上对角线
                    constraints.push({
                        p1: i * (GRID_Y + 1) + j,
                        p2: (i + 1) * (GRID_Y + 1) + (j + 1),
                        restLength: Math.sqrt(
                            Math.pow(PAPER_WIDTH / GRID_X, 2) + 
                            Math.pow(PAPER_HEIGHT / GRID_Y, 2)
                        ),
                        stiffness: 0.6
                    });
                    
                    // 左上对角线
                    constraints.push({
                        p1: (i + 1) * (GRID_Y + 1) + j,
                        p2: i * (GRID_Y + 1) + (j + 1),
                        restLength: Math.sqrt(
                            Math.pow(PAPER_WIDTH / GRID_X, 2) + 
                            Math.pow(PAPER_HEIGHT / GRID_Y, 2)
                        ),
                        stiffness: 0.6
                    });
                }
            }
            
            // 弯曲约束（跳1个粒子）
            for (let i = 0; i <= GRID_X; i++) {
                for (let j = 0; j <= GRID_Y; j++) {
                    if (i < GRID_X - 1) {
                        constraints.push({
                            p1: i * (GRID_Y + 1) + j,
                            p2: (i + 2) * (GRID_Y + 1) + j,
                            restLength: 2 * PAPER_WIDTH / GRID_X,
                            stiffness: 0.9 // 更高的刚度用于弯曲
                        });
                    }
                    
                    if (j < GRID_Y - 1) {
                        constraints.push({
                            p1: i * (GRID_Y + 1) + j,
                            p2: i * (GRID_Y + 1) + (j + 2),
                            restLength: 2 * PAPER_HEIGHT / GRID_Y,
                            stiffness: 0.9
                        });
                    }
                }
            }
        }

        // 生成纸币纹理
        function generateBillTexture(isFront) {
            const canvas = document.createElement('canvas');
            const size = 2048;
            canvas.width = size;
            canvas.height = isFront ? size * (PAPER_HEIGHT / PAPER_WIDTH) : size * (PAPER_HEIGHT / PAPER_WIDTH);
            const ctx = canvas.getContext('2d');
            
            // 设置缩放因子
            const scale = 2.5;
            ctx.scale(scale, scale);
            
            // 底色
            ctx.fillStyle = isFront ? '#f8f3e6' : '#f8f3e6';
            ctx.fillRect(0, 0, canvas.width/scale, canvas.height/scale);
            
            // 边框
            ctx.strokeStyle = '#0d2b06';
            ctx.lineWidth = 4/scale;
            ctx.strokeRect(20/scale, 20/scale, (canvas.width-40)/scale, (canvas.height-40)/scale);
            
            // 中央图案（如果是正面则画猫，背面画建筑）
            if (isFront) {
                // 猫咪头像
                drawCat(ctx, canvas.width/(2*scale), canvas.height/(2*scale) - 50/scale, 80/scale);
                
                // 文字
                ctx.font = `bold ${20/scale}px Arial`;
                ctx.fillStyle = '#0d2b06';
                ctx.textAlign = 'center';
                ctx.fillText('THE UNITED STATES OF AMERICA', canvas.width/(2*scale), 100/scale);
                ctx.fillText('FEDERAL RESERVE NOTE', canvas.width/(2*scale), 130/scale);
                
                ctx.font = `bold ${60/scale}px Arial`;
                ctx.fillText('$100', canvas.width/(2*scale), canvas.height/(2*scale) + 100/scale);
                
                ctx.font = `${12/scale}px Arial`;
                ctx.fillText('ONE HUNDRED DOLLARS', canvas.width/(2*scale), canvas.height/(2*scale) + 130/scale);
            } else {
                // 独立厅建筑
                drawIndependenceHall(ctx, canvas.width/(2*scale), canvas.height/(2*scale), 120/scale);
                
                // 文字
                ctx.font = `bold ${20/scale}px Arial`;
                ctx.fillStyle = '#0d2b06';
                ctx.textAlign = 'center';
                ctx.fillText('THE UNITED STATES OF AMERICA', canvas.width/(2*scale), 100/scale);
                ctx.fillText('IN GOD WE TRUST', canvas.width/(2*scale), canvas.height/(2*scale) - 50/scale);
                
                ctx.font = `bold ${60/scale}px Arial`;
                ctx.fillText('$100', canvas.width/(2*scale), canvas.height/(2*scale) + 100/scale);
                
                ctx.font = `${12/scale}px Arial`;
                ctx.fillText('ONE HUNDRED DOLLARS', canvas.width/(2*scale), canvas.height/(2*scale) + 130/scale);
            }
            
            // 装饰边框
            drawDecorativeBorder(ctx, canvas.width/scale, canvas.height/scale);
            
            // 创建纹理
            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;
            texture.anisotropy = 16;
            return texture;
        }

        // 绘制猫咪
        function drawCat(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 头部
            ctx.fillStyle = '#ffcc99';
            ctx.beginPath();
            ctx.arc(0, 0, size, 0, Math.PI * 2);
            ctx.fill();
            
            // 耳朵
            ctx.fillStyle = '#ff9966';
            ctx.beginPath();
            ctx.moveTo(-size*0.6, -size*0.8);
            ctx.lineTo(-size*0.8, -size*1.2);
            ctx.lineTo(-size*0.4, -size*1.0);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(size*0.6, -size*0.8);
            ctx.lineTo(size*0.8, -size*1.2);
            ctx.lineTo(size*0.4, -size*1.0);
            ctx.fill();
            
            // 内耳
            ctx.fillStyle = '#ffcccc';
            ctx.beginPath();
            ctx.moveTo(-size*0.65, -size*0.85);
            ctx.lineTo(-size*0.75, -size*1.1);
            ctx.lineTo(-size*0.5, -size*0.95);
            ctx.fill();
            
            ctx.beginPath();
            ctx.moveTo(size*0.65, -size*0.85);
            ctx.lineTo(size*0.75, -size*1.1);
            ctx.lineTo(size*0.5, -size*0.95);
            ctx.fill();
            
            // 眼睛
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-size*0.3, -size*0.2, size*0.15, 0, Math.PI * 2);
            ctx.arc(size*0.3, -size*0.2, size*0.15, 0, Math.PI * 2);
            ctx.fill();
            
            // 瞳孔
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-size*0.3, -size*0.2, size*0.08, 0, Math.PI * 2);
            ctx.arc(size*0.3, -size*0.2, size*0.08, 0, Math.PI * 2);
            ctx.fill();
            
            // 高光
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-size*0.33, -size*0.23, size*0.03, 0, Math.PI * 2);
            ctx.arc(size*0.33, -size*0.23, size*0.03, 0, Math.PI * 2);
            ctx.fill();
            
            // 鼻子
            ctx.fillStyle = '#ff9999';
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(-size*0.1, size*0.1);
            ctx.lineTo(size*0.1, size*0.1);
            ctx.closePath();
            ctx.fill();
            
            // 嘴巴
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(0, size*0.15, size*0.1, 0, Math.PI);
            ctx.stroke();
            
            // 胡须
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            for (let i = -1; i <= 1; i += 2) {
                for (let j = -1; j <= 1; j++) {
                    ctx.beginPath();
                    ctx.moveTo(0, size*0.05 + j*size*0.05);
                    ctx.lineTo(i*size*0.3, size*0.05 + j*size*0.05);
                    ctx.stroke();
                }
            }
            
            // 腮红
            ctx.fillStyle = 'rgba(255, 150, 150, 0.3)';
            ctx.beginPath();
            ctx.arc(-size*0.5, 0, size*0.15, 0, Math.PI * 2);
            ctx.arc(size*0.5, 0, size*0.15, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
        }

        // 绘制独立厅
        function drawIndependenceHall(ctx, x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // 基座
            ctx.fillStyle = '#a0a0a0';
            ctx.fillRect(-size, size*0.3, size*2, size*0.4);
            
            // 主体建筑
            ctx.fillStyle = '#c0c0c0';
            ctx.fillRect(-size*0.8, -size*0.2, size*1.6, size*0.5);
            
            // 屋顶
            ctx.fillStyle = '#808080';
            ctx.beginPath();
            ctx.moveTo(-size*0.8, -size*0.2);
            ctx.lineTo(0, -size*0.5);
            ctx.lineTo(size*0.8, -size*0.2);
            ctx.closePath();
            ctx.fill();
            
            // 钟楼
            ctx.fillStyle = '#a0a0a0';
            ctx.fillRect(-size*0.1, -size*0.8, size*0.2, size*0.6);
            
            // 钟面
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, -size*0.5, size*0.1, 0, Math.PI * 2);
            ctx.fill();
            
            // 钟楼屋顶
            ctx.fillStyle = '#606060';
            ctx.beginPath();
            ctx.moveTo(-size*0.15, -size*0.8);
            ctx.lineTo(0, -size*1.0);
            ctx.lineTo(size*0.15, -size*0.8);
            ctx.closePath();
            ctx.fill();
            
            // 窗户
            for (let i = -1; i <= 1; i++) {
                if (i === 0) continue;
                ctx.fillStyle = '#ffff80';
                ctx.fillRect(i*size*0.4 - size*0.05, -size*0.1, size*0.1, size*0.15);
            }
            
            // 门
            ctx.fillStyle = '#808080';
            ctx.fillRect(-size*0.1, size*0.1, size*0.2, size*0.2);
            
            ctx.restore();
        }

        // 绘制装饰边框
        function drawDecorativeBorder(ctx, width, height) {
            // 外边框
            ctx.strokeStyle = '#0d2b06';
            ctx.lineWidth = 2;
            ctx.strokeRect(20, 20, width - 40, height - 40);
            
            // 内边框
            ctx.strokeRect(40, 40, width - 80, height - 80);
            
            // 角落装饰
            drawCornerDecoration(ctx, 40, 40, true, true); // 左上
            drawCornerDecoration(ctx, width - 40, 40, false, true); // 右上
            drawCornerDecoration(ctx, 40, height - 40, true, false); // 左下
            drawCornerDecoration(ctx, width - 40, height - 40, false, false); // 右下
        }

        // 绘制角落装饰
        function drawCornerDecoration(ctx, x, y, isLeft, isTop) {
            ctx.save();
            ctx.translate(x, y);
            
            if (!isLeft) ctx.scale(-1, 1);
            if (!isTop) ctx.scale(1, -1);
            
            ctx.strokeStyle = '#0d2b06';
            ctx.lineWidth = 1;
            
            // 花饰
            for (let i = 0; i < 5; i++) {
                ctx.rotate(Math.PI / 10);
                ctx.beginPath();
                ctx.arc(15, 0, 8, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            ctx.restore();
        }

        // 更新纸币几何体
        function updatePaperGeometry() {
            const positions = paperMesh.geometry.attributes.position.array;
            const backPositions = paperBackMesh.geometry.attributes.position.array;
            
            for (let i = 0; i <= GRID_X; i++) {
                for (let j = 0; j <= GRID_Y; j++) {
                    const idx = i * (GRID_Y + 1) + j;
                    const particle = particles[idx];
                    
                    const posIdx = idx * 3;
                    positions[posIdx] = particle.position.x;
                    positions[posIdx + 1] = particle.position.y;
                    positions[posIdx + 2] = particle.position.z;
                    
                    backPositions[posIdx] = particle.position.x;
                    backPositions[posIdx + 1] = particle.position.y;
                    backPositions[posIdx + 2] = particle.position.z;
                }
            }
            
            paperMesh.geometry.attributes.position.needsUpdate = true;
            paperBackMesh.geometry.attributes.position.needsUpdate = true;
            
            // 更新法线
            paperMesh.geometry.computeVertexNormals();
            paperBackMesh.geometry.computeVertexNormals();
        }

        // Verlet积分
        function verletIntegration(deltaTime) {
            const dt = Math.min(deltaTime, 0.016); // 限制时间步长
            
            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];
                
                if (particle.pinned) continue;
                
                // 记录当前位置
                const temp = particle.position.clone();
                
                // Verlet积分
                const velocity = new THREE.Vector3().subVectors(particle.position, particle.oldPosition);
                velocity.multiplyScalar(DAMPING);
                
                particle.oldPosition.copy(particle.position);
                particle.position.add(velocity).addScaledVector(particle.acceleration, dt * dt);
                
                // 地面碰撞
                if (particle.position.y < 0.01) {
                    particle.position.y = 0.01;
                    // 速度反射和摩擦
                    particle.oldPosition.y = particle.position.y + (particle.oldPosition.y - particle.position.y) * 0.3;
                    particle.oldPosition.x = particle.position.x + (particle.oldPosition.x - particle.position.x) * 0.7;
                    particle.oldPosition.z = particle.position.z + (particle.oldPosition.z - particle.position.z) * 0.7;
                }
            }
        }

        // 求解约束
        function solveConstraints(iterations) {
            for (let iter = 0; iter < iterations; iter++) {
                for (const constraint of constraints) {
                    const p1 = particles[constraint.p1];
                    const p2 = particles[constraint.p2];
                    
                    if (p1.pinned && p2.pinned) continue;
                    
                    const delta = new THREE.Vector3().subVectors(p2.position, p1.position);
                    const distance = delta.length();
                    
                    if (distance > 0) {
                        const diff = (constraint.restLength - distance) / distance;
                        
                        if (!p1.pinned) {
                            p1.position.addScaledVector(delta, -0.5 * diff * constraint.stiffness);
                        }
                        
                        if (!p2.pinned) {
                            p2.position.addScaledVector(delta, 0.5 * diff * constraint.stiffness);
                        }
                    }
                }
            }
        }

        // 应用风力
        function applyWindForce() {
            if (!windEnabled) return;
            
            const time = Date.now() * 0.001;
            
            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];
                
                // 风力随位置和时间变化
                const windStrength = 0.5 + Math.sin(time + i * 0.1) * 0.2;
                const windDirection = new THREE.Vector3(
                    Math.sin(time * 0.5 + i * 0.05) * windStrength,
                    Math.cos(time * 0.3 + i * 0.07) * windStrength,
                    Math.cos(time * 0.4 + i * 0.06) * windStrength
                );
                
                particle.acceleration.add(windDirection);
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 鼠标事件
            window.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            
            // 触摸事件
            window.addEventListener('touchstart', onTouchStart, { passive: false });
            window.addEventListener('touchmove', onTouchMove, { passive: false });
            window.addEventListener('touchend', onTouchEnd);
            
            // 键盘事件
            window.addEventListener('keydown', onKeyDown);
            
            // 窗口大小调整
            window.addEventListener('resize', onWindowResize);
            
            // 滚轮事件
            renderer.domElement.addEventListener('wheel', onMouseWheel);
        }

        // 鼠标按下
        function onMouseDown(event) {
            event.preventDefault();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(paperMesh);
            
            if (intersects.length > 0) {
                startDrag(intersects[0].point);
            }
        }

        // 鼠标移动
        function onMouseMove(event) {
            if (isDragging) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                updateDrag();
            }
        }

        // 鼠标抬起
        function onMouseUp() {
            endDrag();
        }

        // 触摸开始
        function onTouchStart(event) {
            event.preventDefault();
            if (event.touches.length > 0) {
                const touch = event.touches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(paperMesh);
                
                if (intersects.length > 0) {
                    startDrag(intersects[0].point);
                }
            }
        }

        // 触摸移动
        function onTouchMove(event) {
            event.preventDefault();
            if (isDragging && event.touches.length > 0) {
                const touch = event.touches[0];
                mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(touch.clientY / window.innerHeight) * 2 + 1;
                
                updateDrag();
            }
        }

        // 触摸结束
        function onTouchEnd() {
            endDrag();
        }

        // 开始拖拽
        function startDrag(hitPoint) {
            isDragging = true;
            dragParticles = [];
            
            // 创建拖拽平面（垂直于相机）
            dragPlane = new THREE.Plane();
            const normal = camera.getWorldDirection(new THREE.Vector3());
            dragPlane.setFromNormalAndCoplanarPoint(normal, hitPoint);
            
            // 找到附近的粒子
            for (let i = 0; i < particles.length; i++) {
                const particle = particles[i];
                const distance = particle.position.distanceTo(hitPoint);
                
                if (distance < DRAG_RADIUS) {
                    const weight = 1 - Math.min(distance / DRAG_RADIUS, 1);
                    const smoothWeight = weight * weight * (3 - 2 * weight); // 平滑步函数
                    
                    dragParticles.push({
                        index: i,
                        weight: smoothWeight,
                        initialOffset: new THREE.Vector3().subVectors(particle.position, hitPoint)
                    });
                }
            }
        }

        // 更新拖拽
        function updateDrag() {
            raycaster.setFromCamera(mouse, camera);
            const planeIntersect = new THREE.Vector3();
            
            if (raycaster.ray.intersectPlane(dragPlane, planeIntersect)) {
                for (const dragParticle of dragParticles) {
                    const particle = particles[dragParticle.index];
                    const targetPos = new THREE.Vector3().addVectors(planeIntersect, dragParticle.initialOffset);
                    
                    // 限制拖拽距离
                    const maxDistance = MAX_DRAG_DISTANCE;
                    if (targetPos.distanceTo(new THREE.Vector3()) > maxDistance) {
                        targetPos.normalize().multiplyScalar(maxDistance);
                    }
                    
                    particle.position.lerp(targetPos, dragParticle.weight);
                }
            }
        }

        // 结束拖拽
        function endDrag() {
            isDragging = false;
            dragParticles = [];
            dragPlane = null;
        }

        // 键盘事件
        function onKeyDown(event) {
            switch (event.key) {
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    targetRotation.y -= 0.1;
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    targetRotation.y += 0.1;
                    break;
                case 'ArrowUp':
                case 'w':
                case 'W':
                    targetRotation.x -= 0.1;
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    targetRotation.x += 0.1;
                    break;
            }
        }

        // 鼠标滚轮
        function onMouseWheel(event) {
            event.preventDefault();
            camera.position.multiplyScalar(1 + event.deltaY * 0.001);
            // 限制相机距离
            camera.position.clampLength(5, 20);
        }

        // 窗口大小调整
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 吹风按钮事件
        document.getElementById('windBtn').addEventListener('click', function() {
            windEnabled = !windEnabled;
            this.textContent = windEnabled ? '关闭吹风' : '开启吹风';
            this.classList.toggle('active', windEnabled);
            
            // 固定四角
            const corners = [
                0, // 左上
                GRID_Y, // 右上
                GRID_X * (GRID_Y + 1), // 左下
                GRID_X * (GRID_Y + 1) + GRID_Y // 右下
            ];
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].pinned = windEnabled && corners.includes(i);
            }
        });

        // 重置按钮事件
        document.getElementById('resetBtn').addEventListener('click', function() {
            resetPaper();
        });

        // 重置纸币
        function resetPaper() {
            createParticleGrid(); // 重新创建粒子
            updatePaperGeometry();
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            
            const deltaTime = clock.getDelta();
            
            // 更新相机旋转
            currentRotation.x += (targetRotation.x - currentRotation.x) * 0.05;
            currentRotation.y += (targetRotation.y - currentRotation.y) * 0.05;
            
            // 应用相机旋转
            const radius = camera.position.length();
            camera.position.x = radius * Math.sin(currentRotation.y) * Math.cos(currentRotation.x);
            camera.position.y = radius * Math.sin(currentRotation.x);
            camera.position.z = radius * Math.cos(currentRotation.y) * Math.cos(currentRotation.x);
            camera.lookAt(0, 0, 0);
            
            // 物理模拟
            if (!isDragging) {
                applyWindForce();
                verletIntegration(deltaTime);
                solveConstraints(16); // 16次迭代
            }
            
            // 更新几何体
            updatePaperGeometry();
            
            // 渲染
            renderer.render(scene, camera);
        }

        // 初始化
        init();
    </script>
</body>
</html>
