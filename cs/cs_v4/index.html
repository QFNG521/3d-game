<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方块前线 BlockFront — MC × FPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:'Courier New',monospace; user-select:none; -webkit-user-select:none; }
  #app { position:fixed; inset:0; }
  canvas { display:block; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:20; display:none; }

  .bar-wrap { position:absolute; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px; }
  #health-wrap { bottom:64px; }
  .bar-icon { font-size:16px; filter:drop-shadow(0 0 3px #000); }
  .bar { width:220px; height:12px; background:rgba(0,0,0,.55);
    border:2px solid #111; border-radius:3px; overflow:hidden; box-shadow:0 0 6px rgba(0,0,0,.6); }
  .bar > i { display:block; height:100%; transition:width .15s; }
  #hp-fill { background:linear-gradient(90deg,#e33,#f66); width:100%; }
  #hp-fill.low { animation:hpBlink .5s infinite alternate; }
  @keyframes hpBlink { from{filter:brightness(1);} to{filter:brightness(1.8);} }

  /* 快捷栏 */
  #hotbar { position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
    display:flex; gap:4px; }
  .slot { width:52px; height:52px; background:rgba(0,0,0,.5);
    border:2px solid rgba(255,255,255,.35); border-radius:4px;
    position:relative; display:flex; align-items:center; justify-content:center; }
  .slot.active { border-color:#fff; box-shadow:0 0 10px rgba(255,255,255,.5); }
  .slot canvas { width:38px; height:38px; image-rendering:pixelated; }
  .slot .num { position:absolute; top:1px; left:3px; font-size:9px; color:#ddd; text-shadow:1px 1px 0 #000; }
  .slot .cnt { position:absolute; bottom:1px; right:3px; font-size:11px; color:#fff; text-shadow:1px 1px 0 #000; }
  .slot .label { position:absolute; bottom:-16px; left:0; right:0; text-align:center;
    font-size:10px; color:#fff; text-shadow:1px 1px 0 #000; white-space:nowrap; opacity:0; transition:opacity .2s; }
  .slot.active .label { opacity:1; }

  /* 弹药 */
  #ammo-wrap { position:absolute; right:24px; bottom:20px; text-align:right;
    color:#fff; text-shadow:2px 2px 0 #000; }
  #ammo-mag { font-size:34px; font-weight:bold; }
  #ammo-name { font-size:12px; color:#ffd75e; }
  #ammo-state { font-size:12px; color:#f88; height:14px; }

  /* 准星 */
  #crosshair { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:22px; height:22px; }
  #crosshair span { position:absolute; background:rgba(255,255,255,.85);
    box-shadow:0 0 3px #000; transition:all .08s; }
  #crosshair .h { top:50%; width:7px; height:2px; margin-top:-1px; }
  #crosshair .v { left:50%; width:2px; height:7px; margin-left:-1px; }
  #crosshair .l { left:0; } #crosshair .r { right:0; }
  #crosshair .t { top:0; }  #crosshair .b { bottom:0; }
  #crosshair.spread .l { left:-4px; } #crosshair.spread .r { right:-4px; }
  #crosshair.spread .t { top:-4px; }  #crosshair.spread .b { bottom:-4px; }

  /* 顶部信息 */
  #top-info { position:absolute; top:12px; left:50%; transform:translateX(-50%);
    display:flex; gap:18px; color:#fff; text-shadow:2px 2px 0 #000; font-size:15px; }
  #top-info b { color:#ffd75e; }
  #wave-num { color:#ff6b6b; }

  /* 命中提示 */
  #hitmark { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg);
    width:18px; height:18px; opacity:0; }
  #hitmark span { position:absolute; background:#fff; box-shadow:0 0 3px #000; }
  #hitmark .h { top:50%; width:100%; height:2px; margin-top:-1px; }
  #hitmark .v { left:50%; width:2px; height:100%; margin-left:-1px; }
  #hitmark.show { animation:hitPop .18s ease-out; }
  #hitmark.kill span { background:#ff4040; }
  @keyframes hitPop { 0%{opacity:1; transform:translate(-50%,-50%) rotate(45deg) scale(1.4);}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(45deg) scale(.8);} }

  /* 受击红屏 & 低血量 */
  #dmg-vignette { position:fixed; inset:0; pointer-events:none; z-index:15; opacity:0;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(200,0,0,.55) 100%); }
  #heal-flash { position:fixed; inset:0; pointer-events:none; z-index:15; opacity:0;
    background:radial-gradient(ellipse at center, transparent 60%, rgba(80,255,120,.35) 100%); }

  /* 击杀播报 */
  #killfeed { position:absolute; top:60px; right:16px; text-align:right;
    font-size:13px; color:#fff; text-shadow:1px 1px 0 #000; }
  #killfeed div { margin-bottom:4px; animation:feedIn .2s ease-out; }
  @keyframes feedIn { from{opacity:0; transform:translateX(20px);} to{opacity:1;} }

  /* 提示语 */
  #toast { position:absolute; left:50%; bottom:140px; transform:translateX(-50%);
    color:#ffe27a; font-size:14px; text-shadow:1px 1px 0 #000; opacity:0; transition:opacity .3s; }

  /* ---------- 全屏界面 ---------- */
  .screen { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; color:#fff; }
  #menu { background:linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.55)); }
  #menu h1 { font-size:56px; letter-spacing:6px; color:#fff;
    text-shadow:3px 3px 0 #3a5f2a, 6px 6px 0 rgba(0,0,0,.4); margin-bottom:6px; }
  #menu h1 .accent { color:#7ed957; }
  #menu .sub { color:#cfe8c0; font-size:14px; letter-spacing:3px; margin-bottom:34px; }
  .panel { background:rgba(0,0,0,.55); border:2px solid rgba(255,255,255,.25);
    border-radius:8px; padding:18px 26px; margin-bottom:26px; font-size:13px; line-height:2;
    color:#e8e8e8; text-align:left; }
  .panel .key { display:inline-block; min-width:34px; text-align:center;
    background:#2a2a2a; border:1px solid #666; border-bottom-width:3px; border-radius:4px;
    padding:1px 8px; margin:0 2px; color:#ffe27a; font-size:12px; }
  .mc-btn { pointer-events:auto; cursor:pointer; font-family:inherit; font-size:20px;
    letter-spacing:3px; color:#fff; background:linear-gradient(#8f8f8f,#6f6f6f);
    border:2px solid #000; box-shadow:inset 2px 2px 0 rgba(255,255,255,.35),
      inset -2px -2px 0 rgba(0,0,0,.4); padding:12px 60px; text-shadow:2px 2px 0 #3f3f3f; }
  .mc-btn:hover { background:linear-gradient(#9fc2ff,#7fa4e8); }
  .mc-btn.green { background:linear-gradient(#6abe30,#4e9a20); }
  .mc-btn.green:hover { background:linear-gradient(#7ed957,#5cb52a); }
  #menu .foot { position:absolute; bottom:14px; font-size:11px; color:rgba(255,255,255,.5); letter-spacing:1px; }

  /* 波次横幅 */
  #wave-banner { position:fixed; left:0; right:0; top:34%; z-index:40; text-align:center;
    pointer-events:none; opacity:0; }
  #wave-banner .big { font-size:52px; color:#ff5252; letter-spacing:8px;
    text-shadow:3px 3px 0 #4a0000, 0 0 30px rgba(255,60,60,.6); }
  #wave-banner .small { font-size:15px; color:#fff; letter-spacing:3px; margin-top:8px; text-shadow:2px 2px 0 #000; }
  #wave-banner.show { animation:banner 2.6s ease-out forwards; }
  @keyframes banner { 0%{opacity:0; transform:scale(.7);} 12%{opacity:1; transform:scale(1.05);}
    22%{transform:scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:scale(1.02);} }

  /* 死亡 / 胜利 */
  #death { background:rgba(120,0,0,.45); display:none; }
  #death h1, #victory h1 { font-size:52px; letter-spacing:6px; text-shadow:3px 3px 0 rgba(0,0,0,.6); margin-bottom:10px; }
  #death .stats, #victory .stats { font-size:16px; line-height:2; color:#ffe0e0; margin-bottom:30px; text-shadow:1px 1px 0 #000; }
  #victory { background:rgba(0,60,20,.5); display:none; }
  #victory h1 { color:#8dff6a; }
  #victory .stats { color:#e0ffe0; }
  .btn-row { display:flex; gap:16px; }

  /* 暂停 */
  #pause { background:rgba(0,0,0,.6); display:none; }
  #pause h1 { font-size:36px; letter-spacing:5px; margin-bottom:24px; text-shadow:2px 2px 0 #000; }
  #pause .tip { margin-top:22px; font-size:12px; color:#aaa; }

  #loading { background:#0d0f0c; z-index:60; }
  #loading .t { font-size:20px; letter-spacing:4px; color:#9ccc65; margin-bottom:18px; }
  #load-bar { width:320px; height:14px; border:2px solid #4e6b3a; background:#1a2117; }
  #load-fill { height:100%; width:0%; background:repeating-linear-gradient(45deg,#6abe30,#6abe30 8px,#5aa328 8px,#5aa328 16px); transition:width .2s; }
</style>
</head>
<body>
<div id="app"></div>

<!-- HUD -->
<div id="hud">
  <div id="top-info">
    <span>波次 <b id="wave-num">1</b></span>
    <span>敌人 <b id="enemies-left">0</b></span>
    <span>击杀 <b id="kills">0</b></span>
    <span>分数 <b id="score">0</b></span>
  </div>

  <div id="crosshair"><span class="h l"></span><span class="h r"></span><span class="v t"></span><span class="v b"></span></div>
  <div id="hitmark"><span class="h"></span><span class="v"></span></div>

  <div class="bar-wrap" id="health-wrap">
    <span class="bar-icon">❤️</span>
    <div class="bar"><i id="hp-fill"></i></div>
  </div>

  <div id="hotbar"></div>

  <div id="ammo-wrap">
    <div id="ammo-name">突击步枪</div>
    <div id="ammo-mag">30 / 90</div>
    <div id="ammo-state"></div>
  </div>

  <div id="killfeed"></div>
  <div id="toast"></div>
</div>

<div id="dmg-vignette"></div>
<div id="heal-flash"></div>
<div id="wave-banner"><div class="big"></div><div class="small"></div></div>

<!-- 主菜单 -->
<div id="menu" class="screen">
  <h1>方块<span class="accent">前线</span></h1>
  <div class="sub">BLOCKFRONT · MINECRAFT × FPS</div>
  <div class="panel">
    <div><span class="key">W A S D</span> 移动　<span class="key">空格</span> 跳跃　<span class="key">Shift</span> 冲刺</div>
    <div><span class="key">鼠标左键</span> 射击 / 击碎方块　<span class="key">鼠标右键</span> 放置方块</div>
    <div><span class="key">R</span> 换弹　<span class="key">1 ~ 7</span> / 滚轮 切换武器与方块</div>
    <div><span class="key">Esc</span> 暂停</div>
  </div>
  <button class="mc-btn green" id="btn-start">开始游戏</button>
  <div class="foot">提示：子弹可以打穿泥土！小心苦力怕的爆炸会炸开地形 —— 也可以利用它们</div>
</div>

<!-- 暂停 -->
<div id="pause" class="screen">
  <h1>游戏暂停</h1>
  <button class="mc-btn" id="btn-resume">返回游戏</button>
  <div class="tip">Esc 返回 · 提示：泥土和沙子会被子弹击碎，石头需要更多火力</div>
</div>

<!-- 死亡 -->
<div id="death" class="screen">
  <h1>你死了！</h1>
  <div class="stats" id="death-stats"></div>
  <div class="btn-row"><button class="mc-btn green" id="btn-respawn">重生</button></div>
</div>

<!-- 胜利 -->
<div id="victory" class="screen">
  <h1>🏆 成功守住了方块前线！</h1>
  <div class="stats" id="victory-stats"></div>
  <div class="btn-row">
    <button class="mc-btn green" id="btn-endless">无尽模式</button>
    <button class="mc-btn" id="btn-again">重新开始</button>
  </div>
</div>

<!-- 加载 -->
<div id="loading" class="screen">
  <div class="t">正在生成方块世界…</div>
  <div id="load-bar"><div id="load-fill"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js"></script>
<script src="js/noise.js"></script>
<script src="js/textures.js"></script>
<script src="js/sfx.js"></script>
<script src="js/world.js"></script>
<script src="js/particles.js"></script>
<script src="js/player.js"></script>
<script src="js/enemies.js"></script>
<script src="js/game.js"></script>
</body>
</html>
