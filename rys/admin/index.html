<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>瑞妍熙 · 店务管理端</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-mark">瑞</div>
      <div class="logo-text">
        <div class="logo-cn">瑞妍熙</div>
        <div class="logo-en">RUIYANXI</div>
      </div>
    </div>
    <div class="nav-caption">门店管理</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="side-avatar">店</div>
      <div class="side-user">
        <div class="side-user-name">许店长</div>
        <div class="side-user-role">超级管理员</div>
      </div>
      <div class="side-dot"></div>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <div class="topbar-left">
        <div class="page-title" id="pageTitle">经营概览</div>
        <div class="crumb" id="crumb">首页 / 经营概览</div>
      </div>
      <div class="topbar-right">
        <a class="back-link" href="../index.html">← 返回总览</a>
        <button class="store-select" data-action="switchStore">
          <svg viewBox="0 0 24 24" width="14" height="14"><path d="M3 9l1-5h16l1 5M4 9v11h16V9M9 20v-6h6v6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          瑞妍熙 · 静安旗舰店
          <span class="caret">⌄</span>
        </button>
        <div class="top-date" id="topDate"></div>
        <button class="icon-btn" data-action="showNotice" aria-label="消息">
          <svg viewBox="0 0 24 24" width="17" height="17"><path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <i class="badge-dot"></i>
        </button>
        <div class="topbar-line"></div>
        <div class="top-avatar">许</div>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="app.js"></script>
</body>
</html>
